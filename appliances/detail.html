<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheda elettrodomestico — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6}button{margin-top:12px;border:0;background:#365d44;color:white;font-weight:700}.hero{width:100%;aspect-ratio:4/3;object-fit:contain;background:#eee7dd;border-radius:14px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;margin-top:12px}.thumb{padding:0;background:white;border:2px solid transparent;overflow:hidden}.thumb.active{border-color:#365d44}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.manual{padding:14px 0;border-bottom:1px solid #e6dfd5}.manual:last-child{border:0}.open{display:inline-block;padding:10px 14px;border-radius:10px;background:#365d44;color:white;text-decoration:none;font-weight:700}.meta{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px}dialog{border:0;border-radius:16px;padding:0;background:#111;max-width:94vw}dialog::backdrop{background:#000b}dialog img{display:block;max-width:94vw;max-height:90vh}.close{position:fixed;top:16px;right:16px;width:auto;background:white;color:#111}</style></head><body><main><h1>Scheda elettrodomestico</h1><section class="panel"><label for="appliance"><strong>Elettrodomestico</strong></label><select id="appliance"><option>Caricamento…</option></select><button id="load">Apri scheda</button><p id="status"></p></section><section id="card" hidden><section class="panel"><h2 id="name"></h2><p id="description" class="meta"></p><img id="hero" class="hero" alt=""><div id="thumbs" class="thumbs"></div></section><section class="panel"><h2>Manuali</h2><div id="manuals"></div></section></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><dialog id="viewer"><button id="close" class="close">Chiudi</button><img id="full" alt=""></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">const c=window.cucinaHubSupabase,$=s=>document.querySelector(s),a=$('#appliance'),load=$('#load'),status=$('#status'),card=$('#card'),name=$('#name'),description=$('#description'),hero=$('#hero'),thumbs=$('#thumbs'),manuals=$('#manuals'),log=$('#log'),viewer=$('#viewer'),full=$('#full');const esc=v=>String(v??'').replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[x]));const check=(e,x)=>{if(e)throw new Error(`${x}: ${e.message}`)};async function user(){const{data,error}=await c.auth.getSession();check(error,'Sessione');if(!data.session?.user)throw new Error('Accedi prima di aprire la scheda.');return data.session.user}async function init(){try{const u=await user();const{data,error}=await c.from('appliances').select('*').eq('owner_user_id',u.id).order('name');check(error,'Lettura appliances');a.innerHTML='<option value="">Seleziona…</option>';for(const x of data||[]){const o=document.createElement('option');o.value=x.id;o.textContent=x.name;a.appendChild(o)}}catch(e){status.className='error';status.textContent=e.message}}function showImage(item,index){hero.src=item.url;hero.alt=item.alt;full.src=item.url;[...thumbs.children].forEach((b,i)=>b.classList.toggle('active',i===index))}load.onclick=async()=>{status.className='';status.textContent='Caricamento…';card.hidden=true;log.textContent='Avvio…';try{const u=await user();if(!a.value)throw new Error('Seleziona un elettrodomestico.');const{data:ap,error:ae}=await c.from('appliances').select('*').eq('id',a.value).eq('owner_user_id',u.id).single();check(ae,'Lettura appliance');name.textContent=ap.name;description.textContent=ap.description||ap.notes||ap.model||'';const{data:links,error:ie}=await c.from('appliance_images').select('*').eq('appliance_id',ap.id);check(ie,'Lettura immagini');const imageIds=[...new Set((links||[]).map(x=>x.storage_file_id).filter(Boolean))];const{data:imageFiles,error:ife}=imageIds.length?await c.from('storage_files').select('*').in('id',imageIds).eq('owner_user_id',u.id):{data:[],error:null};check(ife,'Lettura file immagini');const byId=new Map((imageFiles||[]).map(x=>[x.id,x]));const images=[];for(const link of links||[]){const f=byId.get(link.storage_file_id);if(!f)continue;const{data,error}=await c.storage.from(f.bucket_name).createSignedUrl(f.object_path,300);check(error,'URL immagine');images.push({url:data.signedUrl,role:link.image_role,sort:link.sort_order||0,alt:link.alt_text||ap.name,name:f.original_filename||''})}images.sort((x,y)=>(x.role==='cover'?-1:0)-(y.role==='cover'?-1:0)||x.sort-y.sort);thumbs.innerHTML='';if(images.length){images.forEach((x,i)=>{const b=document.createElement('button');b.className='thumb';b.type='button';const im=document.createElement('img');im.src=x.url;im.alt=x.alt;b.appendChild(im);b.onclick=()=>showImage(x,i);thumbs.appendChild(b)});showImage(images[0],0);hero.onclick=()=>viewer.showModal()}else{hero.removeAttribute('src');hero.alt='Nessuna immagine';}const{data:aml,error:ame}=await c.from('appliance_manuals').select('*').eq('appliance_id',ap.id);check(ame,'Lettura appliance_manuals');const manualIds=[...new Set((aml||[]).map(x=>x.manual_id).filter(Boolean))];const{data:manualRows,error:me}=manualIds.length?await c.from('manuals').select('*').in('id',manualIds).eq('owner_user_id',u.id):{data:[],error:null};check(me,'Lettura manuals');const fileIds=[...new Set((manualRows||[]).map(x=>x.storage_file_id).filter(Boolean))];const{data:manualFiles,error:mfe}=fileIds.length?await c.from('storage_files').select('*').in('id',fileIds).eq('owner_user_id',u.id):{data:[],error:null};check(mfe,'Lettura file manuali');const mf=new Map((manualFiles||[]).map(x=>[x.id,x]));const roleByManual=new Map((aml||[]).map(x=>[x.manual_id,x.relation_role]));const out=[];for(const m of manualRows||[]){const f=mf.get(m.storage_file_id);if(!f)continue;const{data,error}=await c.storage.from(f.bucket_name).createSignedUrl(f.object_path,300,{download:f.original_filename||undefined});check(error,'URL manuale');out.push({title:m.title,role:roleByManual.get(m.id)||'',url:data.signedUrl,filename:f.original_filename||''})}manuals.innerHTML=out.length?out.map(x=>`<article class="manual"><strong>${esc(x.title)}</strong><div class="meta">${esc(x.role)} · ${esc(x.filename)}</div><a class="open" href="${esc(x.url)}" target="_blank" rel="noopener">Apri PDF</a></article>`).join(''):'<p class="meta">Nessun manuale collegato.</p>';card.hidden=false;const report={pass:true,appliance_id:ap.id,appliance_name:ap.name,image_count:images.length,cover_count:images.filter(x=>x.role==='cover').length,manual_count:out.length,signed_url_count:images.length+out.length,expires_in_seconds:300};log.textContent=`REPORT FINALE\n${JSON.stringify(report,null,2)}`;status.className='ok';status.textContent='Scheda caricata correttamente.'}catch(e){log.textContent=`ERRORE COMPLETO\n${e.stack||e.message}`;status.className='error';status.textContent=e.message}};$('#close').onclick=()=>viewer.close();viewer.onclick=e=>{if(e.target===viewer)viewer.close()};init();</script></body></html>
