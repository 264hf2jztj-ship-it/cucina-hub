<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#365d44">
  <title>Scheda corso — Cucina Hub</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}
    main{max-width:980px;margin:auto;padding:24px}
    .panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}
    select,input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}
    button{margin-top:12px;border:0;background:#365d44;color:white;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .hero{padding:24px;border-radius:16px;background:linear-gradient(135deg,#365d44,#78947f);color:#fff}
    .hero h2{font-size:clamp(28px,5vw,46px);margin:0 0 10px}
    .meta{color:#6d655c}
    .lesson{padding:14px 0;border-bottom:1px solid #e6dfd5}
    .lesson:last-child{border:0}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#ece6dd;color:#4c453d;font-size:13px;font-weight:700}
    .hero .badge{background:rgba(255,255,255,.2);color:#fff}
    .ok{color:#1b6b36}.error{color:#a62424}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:360px;overflow:auto}
    a.back{display:inline-block;margin-bottom:16px;color:#365d44;font-weight:700;text-decoration:none}
    .panel-heading{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
    .panel-heading h2{margin:0}
    .material-tools{margin:14px 0 4px}
    .material-group{margin-top:22px}
    .material-group:first-child{margin-top:14px}
    .material-group-title{display:flex;align-items:center;gap:9px;margin:0 0 10px}
    .material-list{display:grid;gap:12px}
    .material{border:1px solid #e3ddd4;border-radius:14px;padding:15px;background:#fffdfa}
    .material h3{margin:7px 0 5px;font-size:1.05rem}
    .material-meta{margin:0;color:#6d655c;font-size:.92rem;overflow-wrap:anywhere}
    .material-hint{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#f0ece5;color:#4f4942;font-size:.92rem;overflow-wrap:anywhere}
    .material-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
    .open-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:10px;background:#365d44;color:#fff;font-weight:700;text-decoration:none}
    .open-link.secondary{background:#ece6dd;color:#365d44}
    .source-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .source-pill{padding:6px 9px;border-radius:999px;background:#f0ece5;color:#514a43;font-size:.86rem;font-weight:650}
    .empty{padding:18px;border:1px dashed #cfc6ba;border-radius:12px;color:#6d655c;text-align:center}
    [hidden]{display:none!important}
    @media (max-width:640px){main{padding:16px}.hero{padding:19px}.panel{padding:15px}.open-link{width:100%}}
  </style>
</head>
<body>
<main>
  <a class="back" href="../?v=26">← Torna a Cucina Hub</a>
  <h1>Scheda corso</h1>

  <section class="panel">
    <label for="course"><strong>Corso</strong></label>
    <select id="course"><option>Caricamento…</option></select>
    <button id="load" disabled>Apri corso</button>
    <p id="status"></p>
  </section>

  <section id="card" hidden>
    <section class="panel hero">
      <span class="badge">Corso</span>
      <h2 id="title"></h2>
      <p id="description"></p>
      <div id="sourceSummary" class="source-summary"></div>
    </section>

    <section id="lessonsPanel" class="panel" hidden>
      <h2>Lezioni</h2>
      <div id="lessons"></div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>Materiali</h2>
          <p id="materialsSummary" class="meta"></p>
        </div>
      </div>
      <div class="material-tools">
        <label for="materialSearch"><strong>Cerca nei materiali</strong></label>
        <input id="materialSearch" type="search" placeholder="Es. pasta fresca, tartufo, risotto…" autocomplete="off">
      </div>
      <div id="materials"></div>
    </section>
  </section>

  <section class="panel">
    <h2>Registro</h2>
    <pre id="log">In attesa.</pre>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=12"></script>
<script src="../supabase-client.js?v=12"></script>
<script type="module">
const client=window.cucinaHubSupabase;
const $=selector=>document.querySelector(selector);
const courseSelect=$("#course");
const loadButton=$("#load");
const status=$("#status");
const card=$("#card");
const title=$("#title");
const description=$("#description");
const sourceSummary=$("#sourceSummary");
const lessonsPanel=$("#lessonsPanel");
const lessons=$("#lessons");
const materialsSummary=$("#materialsSummary");
const materialSearch=$("#materialSearch");
const materials=$("#materials");
const log=$("#log");

const state={materials:[],categories:new Map(),sources:[]};

const esc=value=>String(value??"").replace(/[&<>\"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
const check=(error,context)=>{if(error)throw new Error(`${context}: ${error.message}`)};
const basename=value=>String(value??"").split(/[\\/]/).filter(Boolean).pop()||"";

async function currentUser(){
  const{data,error}=await client.auth.getSession();
  check(error,"Sessione");
  if(!data.session?.user)throw new Error("Accedi prima di aprire i corsi.");
  return data.session.user;
}

function preferredRow(rows=[]){
  return rows.find(row=>row.file_role==="primary")||rows[0]||null;
}

function materialBadge(material){
  if(material.accessKind==="direct")return "Link diretto";
  if(material.accessKind==="internal")return "Supabase";
  if(material.accessKind==="folder")return "iCloud";
  return material.content_type?.toUpperCase()||"Materiale";
}

function renderMaterials(){
  const query=materialSearch.value.trim().toLocaleLowerCase("it-IT");
  const filtered=state.materials.filter(item=>{
    if(!query)return true;
    return [item.title,item.source_filename,item.source_path,item.categoryName,item.fileHint]
      .filter(Boolean)
      .join(" ")
      .toLocaleLowerCase("it-IT")
      .includes(query);
  });

  materialsSummary.textContent=`${state.materials.length} materiali catalogati${query?` · ${filtered.length} visibili`:""}.`;

  if(!filtered.length){
    materials.innerHTML='<div class="empty">Nessun materiale corrisponde alla ricerca.</div>';
    return;
  }

  const grouped=new Map();
  for(const item of filtered){
    const group=item.categoryName||"Altri materiali";
    if(!grouped.has(group))grouped.set(group,[]);
    grouped.get(group).push(item);
  }

  materials.innerHTML=[...grouped.entries()].map(([group,items])=>`
    <section class="material-group">
      <h3 class="material-group-title">${esc(group)} <span class="badge">${items.length}</span></h3>
      <div class="material-list">
        ${items.map(item=>`
          <article class="material">
            <span class="badge">${esc(materialBadge(item))}</span>
            <h3>${esc(item.title||item.source_filename||"Materiale senza titolo")}</h3>
            <p class="material-meta">${esc(item.source_filename||item.source_path||item.content_type||"")}</p>
            ${item.fileHint&&item.accessKind==="folder"?`<p class="material-hint"><strong>File da aprire:</strong> ${esc(item.fileHint)}</p>`:""}
            <div class="material-actions">
              ${item.accessUrl?`<a class="open-link" href="${esc(item.accessUrl)}" target="_blank" rel="noopener">${esc(item.actionLabel)}</a>`:""}
            </div>
            ${!item.accessUrl?'<p class="material-hint">Il materiale è catalogato, ma non ha ancora una sorgente apribile.</p>':""}
          </article>`).join("")}
      </div>
    </section>`).join("");
}

async function buildMaterials(user,courseId,contentRows,categoryRows){
  const contentIds=contentRows.map(row=>row.id);
  const [sourcesResult,linksResult,refsResult,filesResult]=await Promise.all([
    client.from("course_external_sources").select("id,course_id,category_id,provider,display_name,folder_url,base_path,notes").eq("owner_user_id",user.id).eq("course_id",courseId),
    contentIds.length?client.from("course_content_external_links").select("id,content_id,provider,external_url,display_name,file_role,mime_type,notes").eq("owner_user_id",user.id).in("content_id",contentIds):Promise.resolve({data:[],error:null}),
    contentIds.length?client.from("course_content_external_refs").select("id,content_id,source_id,relative_path,file_role,notes").eq("owner_user_id",user.id).in("content_id",contentIds):Promise.resolve({data:[],error:null}),
    contentIds.length?client.from("course_content_files").select("id,content_id,storage_file_id,file_role").eq("owner_user_id",user.id).in("content_id",contentIds):Promise.resolve({data:[],error:null})
  ]);
  check(sourcesResult.error,"Lettura course_external_sources");
  check(linksResult.error,"Lettura course_content_external_links");
  check(refsResult.error,"Lettura course_content_external_refs");
  check(filesResult.error,"Lettura course_content_files");

  const sources=sourcesResult.data||[];
  state.sources=sources;
  sourceSummary.innerHTML=sources.length
    ? sources.map(source=>`<span class="source-pill">${esc(source.provider==="icloud"?"☁️ iCloud":source.provider)} · ${esc(source.display_name)}</span>`).join("")
    : '<span class="source-pill">Nessun archivio esterno collegato</span>';

  const linksByContent=new Map();
  for(const row of linksResult.data||[]){
    if(!linksByContent.has(row.content_id))linksByContent.set(row.content_id,[]);
    linksByContent.get(row.content_id).push(row);
  }
  const refsByContent=new Map();
  for(const row of refsResult.data||[]){
    if(!refsByContent.has(row.content_id))refsByContent.set(row.content_id,[]);
    refsByContent.get(row.content_id).push(row);
  }
  const filesByContent=new Map();
  for(const row of filesResult.data||[]){
    if(!filesByContent.has(row.content_id))filesByContent.set(row.content_id,[]);
    filesByContent.get(row.content_id).push(row);
  }

  const storageIds=[...new Set((filesResult.data||[]).map(row=>row.storage_file_id).filter(Boolean))];
  const storageResult=storageIds.length
    ? await client.from("storage_files").select("id,bucket_name,object_path,original_filename").eq("owner_user_id",user.id).in("id",storageIds)
    : {data:[],error:null};
  check(storageResult.error,"Lettura storage_files");
  const storageById=new Map((storageResult.data||[]).map(row=>[row.id,row]));
  const sourceById=new Map(sources.map(row=>[row.id,row]));
  const sourceByCategory=new Map();
  let globalSource=null;
  for(const source of sources){
    if(source.category_id&&!sourceByCategory.has(source.category_id))sourceByCategory.set(source.category_id,source);
    if(!source.category_id&&!globalSource)globalSource=source;
  }
  const categoryById=new Map(categoryRows.map(row=>[row.id,row]));

  const built=[];
  for(const content of contentRows){
    const direct=preferredRow(linksByContent.get(content.id));
    const internalLink=preferredRow(filesByContent.get(content.id));
    const externalRef=preferredRow(refsByContent.get(content.id));
    const explicitSource=externalRef?sourceById.get(externalRef.source_id):null;
    const folderSource=explicitSource||sourceByCategory.get(content.category_id)||globalSource;
    const categoryName=categoryById.get(content.category_id)?.name||"Altri materiali";

    const item={...content,categoryName,accessKind:null,accessUrl:null,actionLabel:null,fileHint:null};

    if(direct?.external_url){
      item.accessKind="direct";
      item.accessUrl=direct.external_url;
      item.actionLabel=direct.display_name?`Apri ${direct.display_name}`:"Apri file";
    }else if(internalLink?.storage_file_id){
      const storageFile=storageById.get(internalLink.storage_file_id);
      if(storageFile){
        const{data,error}=await client.storage.from(storageFile.bucket_name).createSignedUrl(storageFile.object_path,900,{download:storageFile.original_filename||undefined});
        check(error,`URL firmato ${content.title}`);
        if(data?.signedUrl){
          item.accessKind="internal";
          item.accessUrl=data.signedUrl;
          item.actionLabel="Apri PDF";
        }
      }
    }

    if(!item.accessUrl&&folderSource?.folder_url){
      item.accessKind="folder";
      item.accessUrl=folderSource.folder_url;
      item.actionLabel=folderSource.provider==="icloud"?"Apri cartella iCloud":"Apri archivio";
      item.fileHint=externalRef?.relative_path||content.source_filename||basename(content.source_path)||content.source_path;
    }

    built.push(item);
  }

  return built;
}

async function loadCourse(courseId){
  status.className="";
  status.textContent="Caricamento…";
  card.hidden=true;
  try{
    const user=await currentUser();
    if(!courseId)throw new Error("Seleziona un corso.");

    const [courseResult,lessonsResult,categoriesResult,contentsResult]=await Promise.all([
      client.from("courses").select("id,title,description,created_at").eq("id",courseId).eq("owner_user_id",user.id).single(),
      client.from("course_lessons").select("id,course_id,title,sort_order").eq("course_id",courseId).order("sort_order"),
      client.from("course_categories").select("id,course_id,name,slug,sort_order").eq("owner_user_id",user.id).eq("course_id",courseId).order("sort_order"),
      client.from("course_contents").select("id,course_id,category_id,title,content_type,source_filename,source_path,sort_order,metadata,content_code").eq("owner_user_id",user.id).eq("course_id",courseId).order("sort_order")
    ]);
    check(courseResult.error,"Lettura corso");
    check(lessonsResult.error,"Lettura lezioni");
    check(categoriesResult.error,"Lettura categorie");
    check(contentsResult.error,"Lettura contenuti");

    const course=courseResult.data;
    const lessonRows=lessonsResult.data||[];
    const categoryRows=categoriesResult.data||[];
    const contentRows=contentsResult.data||[];

    title.textContent=course.title;
    description.textContent=course.description||"Nessuna descrizione disponibile.";

    lessonsPanel.hidden=!lessonRows.length;
    lessons.innerHTML=lessonRows.map((lesson,index)=>`<article class="lesson"><span class="badge">Lezione ${index+1}</span><h3>${esc(lesson.title)}</h3></article>`).join("");

    state.categories=new Map(categoryRows.map(row=>[row.id,row]));
    state.materials=await buildMaterials(user,course.id,contentRows,categoryRows);
    materialSearch.value="";
    renderMaterials();

    card.hidden=false;
    status.className="ok";
    status.textContent="Corso caricato correttamente.";
    log.textContent=`REPORT FINALE\n${JSON.stringify({
      pass:true,
      course_id:course.id,
      course_title:course.title,
      lesson_count:lessonRows.length,
      material_count:state.materials.length,
      direct_links:state.materials.filter(item=>item.accessKind==="direct").length,
      internal_files:state.materials.filter(item=>item.accessKind==="internal").length,
      folder_links:state.materials.filter(item=>item.accessKind==="folder").length,
      unavailable:state.materials.filter(item=>!item.accessUrl).length,
      external_sources:state.sources.length
    },null,2)}`;
  }catch(error){
    status.className="error";
    status.textContent=error.message;
    log.textContent=`ERRORE COMPLETO\n${error.stack||error.message}`;
  }
}

async function init(){
  try{
    const user=await currentUser();
    const{data,error}=await client.from("courses").select("id,title,description,created_at").eq("owner_user_id",user.id).order("created_at",{ascending:false});
    check(error,"Lettura courses");
    courseSelect.innerHTML="";

    if(!(data||[]).length){
      const option=document.createElement("option");
      option.textContent="Nessun corso presente";
      option.value="";
      courseSelect.appendChild(option);
      status.className="meta";
      status.textContent="La struttura è pronta, ma la tabella courses è ancora vuota.";
      log.textContent=`REPORT FINALE\n${JSON.stringify({pass:true,course_count:0,empty_state:true},null,2)}`;
      return;
    }

    const placeholder=document.createElement("option");
    placeholder.value="";
    placeholder.textContent="Seleziona…";
    courseSelect.appendChild(placeholder);
    for(const course of data){
      const option=document.createElement("option");
      option.value=course.id;
      option.textContent=course.title;
      courseSelect.appendChild(option);
    }
    loadButton.disabled=false;
    status.className="ok";
    status.textContent=`${data.length} corsi disponibili.`;

    const requestedCourse=new URLSearchParams(window.location.search).get("course");
    if(requestedCourse&&(data||[]).some(course=>course.id===requestedCourse)){
      courseSelect.value=requestedCourse;
      await loadCourse(requestedCourse);
    }
  }catch(error){
    status.className="error";
    status.textContent=error.message;
    log.textContent=`ERRORE COMPLETO\n${error.stack||error.message}`;
  }
}

loadButton.addEventListener("click",()=>loadCourse(courseSelect.value));
courseSelect.addEventListener("change",()=>{if(courseSelect.value)void loadCourse(courseSelect.value)});
materialSearch.addEventListener("input",renderMaterials);

void init();
</script>
</body>
</html>
