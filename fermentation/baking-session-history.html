<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Storico impasti — Cucina Hub</title>
  <style>
    :root{--bg:#f6f3ee;--card:#fff;--line:#ddd5ca;--green:#365d44;--muted:#6d655c;--blue:#245987}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#26221d;font-family:system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.head h1{margin:0}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.button{padding:12px 15px;border-radius:11px;background:var(--green);color:white;text-decoration:none;font-weight:800}.button.secondary{background:#eee8df;color:#26221d}.button.diary{background:#fff0d8;color:#7a4a00}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:#faf8f4;border-radius:13px;padding:14px}.stat strong{display:block;font-size:1.5rem}.stat span,.meta,.status{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #bbb2a6;border-radius:10px;font:inherit}.toolbar input{flex:1;min-width:220px}.list{display:grid;gap:12px}.session{border:1px solid var(--line);border-radius:15px;padding:16px}.session-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.session h3{margin:0 0 5px}.rating{font-size:1.1rem;white-space:nowrap}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.metric{background:#faf8f4;border-radius:9px;padding:7px 9px;font-size:.9rem}.metric.changed{background:#fff0d8;color:#7a4a00}.evaluation{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.evaluation div{background:#eef5f0;border-radius:9px;padding:9px}.evaluation span{display:block;color:var(--muted);font-size:.8rem}.evaluation strong{display:block;margin-top:3px}.notes{border-left:4px solid var(--green);padding:9px 12px;background:#f7faf7;border-radius:8px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:800}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:760px){main{padding:16px}.head{flex-direction:column}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.session-top{flex-direction:column}.evaluation{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:430px){.stats,.evaluation{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>Storico impasti</h1><p class="meta">Consulta sessioni completate, risultati reali e valutazioni del Diario fermentazioni.</p></div>
    <div class="head-actions"><a class="button secondary" href="./baking-sessions.html?v=6">← SESSIONI</a><a class="button" href="./baking-wizard.html?v=20">+ NUOVA SESSIONE</a></div>
  </div>

  <section class="panel"><div class="stats"><div class="stat"><strong id="count">—</strong><span>sessioni completate</span></div><div class="stat"><strong id="diaryCount">—</strong><span>valutazioni salvate</span></div><div class="stat"><strong id="avgRating">—</strong><span>valutazione media</span></div><div class="stat"><strong id="avgDuration">—</strong><span>durata media reale</span></div></div></section>

  <section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="Cerca titolo, farina o stile…"><select id="sort"><option value="recent">Più recenti</option><option value="oldest">Meno recenti</option><option value="rating">Valutazione migliore</option><option value="hydration">Idratazione maggiore</option></select></div></section>

  <section class="panel"><div id="list" class="list"><div class="empty">Caricamento storico…</div></div><p id="status" class="status"></p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=12"></script>
<script src="../supabase-client.js?v=12"></script>
<script>
const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);let sessions=[],evaluations={};
const outcomeLabels={underfermented:'Impasto indietro',balanced:'Fermentazione equilibrata',overfermented:'Oltre fermentazione',uncertain:'Esito incerto'};
function esc(v){return String(v??'').replace(/[&<>\'\"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function fmt(v){if(!v)return '—';return new Date(v).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function minutesBetween(a,b){if(!a||!b)return null;const n=Math.round((new Date(b)-new Date(a))/60000);return Number.isFinite(n)&&n>=0?n:null}
function durationLabel(n){if(n==null)return '—';const h=Math.floor(n/60),m=n%60;return h?`${h} h ${m} min`:`${m} min`}
function stars(value){const n=Math.max(0,Math.min(5,Number(value)||0));return '★'.repeat(n)+'☆'.repeat(5-n)}
function completion(s){const values=Object.values(s.workflow_runtime?.activities||{});if(!values.length)return null;return Math.round(values.filter(x=>x.status==='completed').length/values.length*100)}
function ratingFor(s){return Number(evaluations[s.id]?.overall_rating||s.rating||0)}
function timingMetric(label,actual,planned){if(actual===null||actual===undefined)return '';const delta=Number(actual)-Number(planned||0),text=delta===0?'come previsto':`${delta>0?'+':''}${delta} min`;return `<span class="metric ${delta!==0?'changed':''}">${esc(label)}: ${esc(text)}</span>`}
function updateStats(){const ratings=sessions.map(ratingFor).filter(n=>n>0);const durations=sessions.map(s=>minutesBetween(s.started_at,s.completed_at)).filter(n=>n!=null);$('#count').textContent=sessions.length;$('#diaryCount').textContent=Object.keys(evaluations).length;$('#avgRating').textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+'/5':'—';$('#avgDuration').textContent=durations.length?durationLabel(Math.round(durations.reduce((a,b)=>a+b,0)/durations.length)):'—'}
function render(){const q=$('#search').value.trim().toLowerCase();let visible=sessions.filter(s=>[s.title,s.flour_name,s.product_style].some(v=>String(v||'').toLowerCase().includes(q)));const sort=$('#sort').value;visible.sort((a,b)=>sort==='oldest'?new Date(a.completed_at||a.updated_at)-new Date(b.completed_at||b.updated_at):sort==='rating'?ratingFor(b)-ratingFor(a):sort==='hydration'?(Number(b.hydration_percent)||0)-(Number(a.hydration_percent)||0):new Date(b.completed_at||b.updated_at)-new Date(a.completed_at||a.updated_at));if(!visible.length){$('#list').innerHTML='<div class="empty">Nessuna sessione completata corrisponde alla ricerca.</div>';return}$('#list').innerHTML=visible.map(s=>{const dur=minutesBetween(s.started_at,s.completed_at),pct=completion(s),guide=s.workflow_definition?`../workflow-engine/guided-session.html?session=${encodeURIComponent(s.id)}&v=10`:null,e=evaluations[s.id],rating=ratingFor(s),resultNotes=e?.result_notes||s.result_notes,nextNotes=e?.next_time_notes;return `<article class="session"><div class="session-top"><div><h3>${esc(s.title)}</h3><div class="meta">Completata ${fmt(s.completed_at||s.updated_at)} · pasto previsto ${fmt(s.target_meal_at)}</div></div><div class="rating" title="Valutazione">${rating?stars(rating):'Non valutata'}</div></div><div class="metrics"><span class="metric">${esc(s.flour_name||'Farina non indicata')}</span><span class="metric">${esc(s.flour_weight_g??'—')} g</span><span class="metric">Idratazione ${esc(s.hydration_percent??'—')}%</span><span class="metric">Forno ${esc(s.oven_temperature_c??'—')} °C</span><span class="metric">Durata ${durationLabel(dur)}</span>${pct!=null?`<span class="metric">Attività ${pct}%</span>`:''}${e?timingMetric('Puntata',e.actual_bulk_minutes,s.bulk_fermentation_minutes)+timingMetric('Frigo',e.actual_cold_minutes,s.cold_fermentation_minutes)+timingMetric('Appretto',e.actual_proof_minutes,s.final_proof_minutes):''}</div>${e?`<div class="evaluation"><div><span>Fermentazione</span><strong>${esc(outcomeLabels[e.fermentation_outcome]||e.fermentation_outcome)} · ${e.fermentation_rating}/5</strong></div><div><span>Lavorabilità</span><strong>${e.workability_rating}/5</strong></div><div><span>Struttura</span><strong>${e.structure_rating}/5</strong></div><div><span>Digeribilità percepita</span><strong>${e.digestibility_rating}/5</strong></div></div>`:''}${resultNotes?`<div class="notes"><strong>Risultato</strong><br>${esc(resultNotes)}</div>`:''}${nextNotes?`<div class="notes"><strong>Prossima prova</strong><br>${esc(nextNotes)}</div>`:''}${s.learning_notes?`<div class="notes"><strong>Apprendimento precedente</strong><br>${esc(s.learning_notes)}</div>`:''}<div class="actions">${guide?`<a class="button secondary" href="${guide}">RIVEDI SESSIONE</a>`:''}<a class="button diary" href="./fermentation-diary.html?session=${encodeURIComponent(s.id)}&v=1">${e?'RIVEDI DIARIO':'VALUTA RISULTATO'}</a></div></article>`}).join('')}
async function load(){try{$('#status').textContent='Caricamento…';const auth=await c.auth.getSession();if(!auth.data.session?.user)throw new Error('Accedi prima di continuare.');const {data,error}=await c.from('baking_sessions').select('*').eq('status','completed').order('completed_at',{ascending:false,nullsFirst:false});if(error)throw error;sessions=data||[];evaluations={};if(sessions.length){const result=await c.from('baking_session_evaluations').select('*').in('session_id',sessions.map(item=>item.id));if(result.error)throw result.error;(result.data||[]).forEach(item=>{evaluations[item.session_id]=item})}updateStats();render();$('#status').textContent=`${sessions.length} sessioni nello storico · ${Object.keys(evaluations).length} valutazioni nel Diario.`}catch(e){$('#list').innerHTML='<div class="empty">Impossibile caricare lo storico.</div>';$('#status').textContent=e.message}}
$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);load();
</script>
</body>
</html>
