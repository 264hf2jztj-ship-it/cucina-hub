<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Panificazione — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:1050px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select,button,a.button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}button,a.button{border:0;background:#365d44;color:#fff;font-weight:800;text-decoration:none;text-align:center}.secondary{background:#eee8df!important;color:#26221d!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button,.actions a{width:auto}.muted{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}.proposal{background:#f2f7f3;border:1px solid #bdd1c2;border-radius:14px;padding:16px;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#fff;border:1px solid #d7e4da;border-radius:10px;padding:10px}.metric strong{display:block;font-size:1.15rem}.timeline{display:grid;gap:9px}.step{border-left:4px solid #365d44;padding:9px 12px;background:#faf8f4;border-radius:8px}.step small{display:block;color:#6d655c;margin-top:3px}.note{background:#fff8df;border:1px solid #e4cf7d;border-radius:10px;padding:10px;margin-top:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><h1>Wizard di panificazione</h1><p class="muted">Genera una sessione completa e salvala come workflow guidato.</p><section class="panel"><div class="grid"><div class="full"><label>Cosa vuoi preparare?</label><select id="style"><option value="roman_pan">Pizza in teglia romana</option><option value="neapolitan">Pizza napoletana</option><option value="home_round">Pizza tonda nel forno di casa</option><option value="focaccia">Focaccia</option><option value="bread">Pane</option></select></div><div><label>Farina</label><input id="flourName" placeholder="Es. Caputo Nuvola"></div><div><label>Farina totale (g)</label><input id="flourWeight" type="number" min="100" step="10" value="1000"></div><div><label>Ambiente</label><select id="environmentProfile"></select></div><div><label>Lievito</label><select id="yeastType"><option value="fresh_yeast">Lievito fresco</option><option value="dry_yeast">Lievito secco</option><option value="sourdough">Lievito madre</option></select></div><div><label>Quando vuoi mangiare?</label><input id="targetMeal" type="datetime-local"></div><div><label>Cottura</label><select id="ovenType"><option value="samsung_oven">Forno Samsung</option><option value="weber_kettle">Weber Kettle</option><option value="air_fryer">Friggitrice ad aria</option><option value="other">Altro</option></select></div><div><label>Modalità guida</label><select id="guidanceMode"><option value="beginner">Principiante</option><option value="expert">Esperto</option></select></div><div class="full actions"><button id="generate" type="button">GENERA SESSIONE</button><button id="reset" class="secondary" type="button">NUOVO</button></div></div><div id="proposal" class="proposal" hidden><h2>Proposta Cucina Hub</h2><p id="summary"></p><div class="metrics"><div class="metric">Acqua<strong id="water"></strong></div><div class="metric">Sale<strong id="salt"></strong></div><div class="metric">Lievito<strong id="yeast"></strong></div><div class="metric">Idratazione<strong id="hydration"></strong></div><div class="metric">Cottura<strong id="bake"></strong></div><div class="metric">Workflow<strong id="phases"></strong></div></div><div id="ovenNote" class="note"></div><h3>Timeline prevista</h3><div id="timeline" class="timeline"></div><div class="actions" style="margin-top:14px"><button id="save" type="button">SALVA SESSIONE</button><a id="start" class="button" hidden>INIZIA SESSIONE GUIDATA</a></div></div><p id="status" class="muted">In attesa.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script src="../workflow-engine/session-workflow-builder.js?v=1"></script><script>
const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);let owner,environments=[],plan=null,workflow=null;
const presets={roman_pan:{name:'Pizza in teglia romana',hydration:80,salt:2.5,base:.15,bulk:120,proof:180,ideal:280,bake:16},neapolitan:{name:'Pizza napoletana',hydration:65,salt:2.8,base:.10,bulk:120,proof:240,ideal:300,bake:7},home_round:{name:'Pizza tonda forno casa',hydration:68,salt:2.6,base:.18,bulk:120,proof:180,ideal:280,bake:9},focaccia:{name:'Focaccia',hydration:75,salt:2.3,base:.25,bulk:120,proof:150,ideal:230,bake:22},bread:{name:'Pane',hydration:70,salt:2,base:.20,bulk:180,proof:150,ideal:240,bake:40}};
const appliances={samsung_oven:{label:'Forno Samsung',max:250,preheat:45,note:'Temperatura limitata a 250 °C. Compensa con preriscaldamento completo, teglia ben calda e posizione bassa.'},weber_kettle:{label:'Weber Kettle',max:350,preheat:50,note:'Usa pietra ben preriscaldata e gestione indiretta della brace.'},air_fryer:{label:'Friggitrice ad aria',max:200,preheat:5,note:'Solo piccole porzioni; temperatura limitata a 200 °C.'},other:{label:'Altro',max:250,preheat:30,note:'Profilo prudenziale fino a 250 °C.'}};
function msg(t,k='muted'){$('#status').className=k;$('#status').textContent=t}function localValue(d){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function defaultDate(){const d=new Date(Date.now()+86400000);d.setHours(20,0,0,0);$('#targetMeal').value=localValue(d)}function fmt(d){return d.toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}function env(){return environments.find(x=>x.id===$('#environmentProfile').value)}
function generate(){try{const p=presets[$('#style').value],flour=Number($('#flourWeight').value),target=new Date($('#targetMeal').value);if(!flour||flour<100)throw new Error('Inserisci almeno 100 g di farina.');if(Number.isNaN(target.getTime()))throw new Error('Scegli data e ora del pasto.');const hours=(target-Date.now())/3600000;if(hours<4)throw new Error('Servono almeno 4 ore.');const room=Number(env()?.room_temperature_c||22),device=appliances[$('#ovenType').value];let bulk=p.bulk,proof=p.proof,cold=Math.max(0,Math.floor(hours*60)-bulk-proof-device.preheat-p.bake-40);if(hours<10||cold<240){cold=0;bulk=Math.max(90,Math.floor(hours*60)-proof-device.preheat-p.bake-40)}let yp=p.base*(24/Math.max(hours,4))*Math.pow(1.12,22-room);if($('#yeastType').value==='dry_yeast')yp*=.4;if($('#yeastType').value==='sourdough')yp=Math.min(25,Math.max(10,15*(24/Math.max(hours,4))));const water=flour*p.hydration/100,salt=flour*p.salt/100,yeast=flour*yp/100,oven=Math.min(p.ideal,device.max),bake=p.bake+(oven<p.ideal?3:0);plan={owner_user_id:owner,environment_profile_id:$('#environmentProfile').value||null,title:`${p.name} — ${fmt(target)}`,product_style:$('#style').value,status:'planned',flour_name:$('#flourName').value.trim()||null,flour_weight_g:flour,yeast_type:$('#yeastType').value,target_meal_at:target.toISOString(),hydration_percent:p.hydration,water_weight_g:+water.toFixed(1),salt_weight_g:+salt.toFixed(1),yeast_weight_g:+yeast.toFixed(2),bulk_fermentation_minutes:bulk,cold_fermentation_minutes:cold,final_proof_minutes:proof,target_dough_temperature_c:24,oven_type:$('#ovenType').value,oven_temperature_c:oven,preheat_minutes:device.preheat,bake_minutes:bake,guidance_mode:$('#guidanceMode').value};workflow=CucinaHubSessionWorkflowBuilder.build(plan);const start=new Date(target.getTime()-workflow.estimated_minutes*60000);let cursor=new Date(start);const timeline=workflow.phases.map(x=>{const at=new Date(cursor);cursor=new Date(cursor.getTime()+x.estimated_minutes*60000);return{title:x.title,at}});plan.generated_plan=timeline.map(x=>({label:x.title,at:x.at.toISOString()}));plan.workflow_definition=workflow;$('#summary').textContent=`${p.name}, ${flour} g di farina, ${hours.toFixed(1)} ore disponibili, ambiente ${room} °C.`;$('#water').textContent=plan.water_weight_g+' g';$('#salt').textContent=plan.salt_weight_g+' g';$('#yeast').textContent=plan.yeast_weight_g+' g';$('#hydration').textContent=p.hydration+'%';$('#bake').textContent=oven+' °C · '+bake+' min';$('#phases').textContent=workflow.phases.length+' fasi';$('#ovenNote').textContent=device.note;$('#timeline').innerHTML=timeline.map(x=>`<div class="step"><strong>${fmt(x.at)} — ${x.title}</strong></div>`).join('');$('#proposal').hidden=false;$('#start').hidden=true;msg('Workflow generato. Controlla e salva.','ok')}catch(e){msg(e.message,'error')}}
async function save(){try{if(!plan)generate();if(!plan||!workflow)throw new Error('Genera prima la sessione.');const payload={...plan};delete payload.preheat_minutes;delete payload.bake_minutes;const{data,error}=await c.from('baking_sessions').insert(payload).select('id').single();if(error)throw error;$('#start').href=`../workflow-engine/guided-session.html?session=${encodeURIComponent(data.id)}&v=6`;$('#start').hidden=false;msg('Sessione salvata. Ora puoi avviare la guida.','ok')}catch(e){msg(e.message,'error')}}
async function init(){try{const{data,error}=await c.auth.getSession();if(error)throw error;if(!data.session?.user)throw new Error('Accedi prima di continuare.');owner=data.session.user.id;const r=await c.from('fermentation_environment_profiles').select('*').eq('owner_user_id',owner).order('is_default',{ascending:false}).order('name');if(r.error)throw r.error;environments=r.data||[];$('#environmentProfile').innerHTML='<option value="">Nessun profilo</option>'+environments.map(x=>`<option value="${x.id}">${x.name}${x.is_default?' — predefinito':''}</option>`).join('');$('#environmentProfile').value=environments.find(x=>x.is_default)?.id||'';defaultDate();msg('Pronto.','ok')}catch(e){msg(e.message,'error')}}
$('#generate').onclick=generate;$('#save').onclick=save;$('#reset').onclick=()=>{plan=null;workflow=null;$('#proposal').hidden=true;$('#start').hidden=true;$('#flourName').value='';$('#flourWeight').value=1000;defaultDate();msg('Nuova sessione.')};init();
</script></body></html>
