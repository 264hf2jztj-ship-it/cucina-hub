<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Panificazione — Cucina Hub</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:1050px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}button{border:0;background:#365d44;color:#fff;font-weight:800}.secondary{background:#eee8df;color:#26221d}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{width:auto}.muted{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}.proposal{background:#f2f7f3;border:1px solid #bdd1c2;border-radius:14px;padding:16px;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#fff;border:1px solid #d7e4da;border-radius:10px;padding:10px}.metric strong{display:block;font-size:1.15rem}.timeline{display:grid;gap:9px}.step{border-left:4px solid #365d44;padding:9px 12px;background:#faf8f4;border-radius:8px}.step small{display:block;color:#6d655c;margin-top:3px}.note{background:#fff8df;border:1px solid #e4cf7d;border-radius:10px;padding:10px;margin-top:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main><h1>Wizard di panificazione</h1><p class="muted">Crea una sessione reale: Cucina Hub calcola ingredienti, uso dell’impastatrice, fermentazione e cottura compatibile con l’elettrodomestico scelto.</p>
<section class="panel"><div class="grid">
<div class="full"><label>Cosa vuoi preparare?</label><select id="style"><option value="roman_pan">Pizza in teglia romana</option><option value="neapolitan">Pizza napoletana</option><option value="home_round">Pizza tonda nel forno di casa</option><option value="focaccia">Focaccia</option><option value="bread">Pane</option></select></div>
<div><label>Farina</label><input id="flourName" placeholder="Es. Caputo Nuvola"></div><div><label>Farina totale (g)</label><input id="flourWeight" type="number" min="100" step="10" value="1000"></div>
<div><label>Ambiente</label><select id="environmentProfile"></select></div><div><label>Lievito</label><select id="yeastType"><option value="fresh_yeast">Lievito fresco</option><option value="dry_yeast">Lievito secco</option><option value="sourdough">Lievito madre</option></select></div>
<div><label>Quando vuoi mangiare?</label><input id="targetMeal" type="datetime-local"></div><div><label>Cottura</label><select id="ovenType"><option value="samsung_oven">Forno Samsung</option><option value="weber_kettle">Weber Kettle</option><option value="air_fryer">Friggitrice ad aria</option><option value="other">Altro</option></select></div>
<div class="full actions"><button id="generate">GENERA SESSIONE</button><button id="reset" class="secondary">NUOVO</button></div></div>
<div id="proposal" class="proposal" hidden><h2>Proposta Cucina Hub</h2><p id="summary"></p><div class="metrics"><div class="metric">Acqua<strong id="water"></strong></div><div class="metric">Sale<strong id="salt"></strong></div><div class="metric">Lievito<strong id="yeast"></strong></div><div class="metric">Idratazione<strong id="hydration"></strong></div><div class="metric">Cottura<strong id="bake"></strong></div></div><div id="ovenNote" class="note"></div><h3>Timeline e checklist</h3><div id="timeline" class="timeline"></div><div class="actions" style="margin-top:14px"><button id="save">SALVA SESSIONE</button></div></div><p id="status" class="muted">In attesa.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script>
<script>
const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);let owner,environments=[],plan=null;
const presets={roman_pan:{name:'Pizza in teglia romana',hydration:80,salt:2.5,baseFresh:.15,bulk:120,proof:180,idealOven:280,bake:16,mix:'high'},neapolitan:{name:'Pizza napoletana',hydration:65,salt:2.8,baseFresh:.10,bulk:120,proof:240,idealOven:300,bake:7,mix:'standard'},home_round:{name:'Pizza tonda forno casa',hydration:68,salt:2.6,baseFresh:.18,bulk:120,proof:180,idealOven:280,bake:9,mix:'standard'},focaccia:{name:'Focaccia',hydration:75,salt:2.3,baseFresh:.25,bulk:120,proof:150,idealOven:230,bake:22,mix:'high'},bread:{name:'Pane',hydration:70,salt:2,baseFresh:.20,bulk:180,proof:150,idealOven:240,bake:40,mix:'standard'}};
const appliances={samsung_oven:{label:'Forno Samsung',max:250,preheat:45,note:'Il manuale del Samsung NV75N5641RS indica un limite impostabile fino a 250 °C. Uso quindi 250 °C e compenso con preriscaldamento completo, teglia ben calda e posizione bassa.'},weber_kettle:{label:'Weber Kettle',max:350,preheat:50,note:'Usa cottura indiretta e, per la pizza, pietra ben preriscaldata. La temperatura reale dipende da brace, disposizione carbone e accessori.'},air_fryer:{label:'Friggitrice ad aria',max:200,preheat:5,note:'Adatta solo a piccole porzioni. La ricetta viene limitata a 200 °C e può richiedere pezzature ridotte.'},other:{label:'Altro',max:250,preheat:30,note:'Temperatura limitata prudenzialmente a 250 °C finché non viene definito un profilo tecnico dell’apparecchio.'}};
function msg(t,k='muted'){$('#status').className=k;$('#status').textContent=t}function localValue(d){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function defaultDate(){const d=new Date(Date.now()+86400000);d.setHours(20,0,0,0);$('#targetMeal').value=localValue(d)}function fmt(d){return d.toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}function env(){return environments.find(x=>x.id===$('#environmentProfile').value)}
function mixerSteps(start,p,water,yeastType){const high=p.mix==='high',firstWater=Math.round(water*(high?.7:.8)),restWater=Math.round(water-firstWater),steps=[];let t=new Date(start);const add=(m,label,detail)=>{steps.push({label,detail,at:new Date(t)});t=new Date(t.getTime()+m*60000)};add(0,`Impastatrice DCG: inserisci farina e ${firstWater} g d’acqua`,'Usa il gancio. Tieni da parte l’acqua restante.');add(3,'Velocità bassa per 3 minuti','Deve sparire la farina asciutta; non cercare ancora un impasto liscio.');if(high)add(15,'Riposo di 15 minuti','Copri la ciotola: aiuta l’assorbimento negli impasti molto idratati.');add(2,`Aggiungi ${yeastType==='fresh_yeast'?'il lievito sciolto in poca acqua':'il lievito'} e riparti piano`,'Aspetta che sia distribuito prima di aumentare velocità.');add(high?6:4,`Versa gradualmente i ${restWater} g d’acqua restanti`,'Aggiungila in più riprese solo quando la precedente è assorbita.');add(2,'Aggiungi il sale','Evita di versarlo direttamente sul lievito non ancora incorporato.');add(high?6:5,'Velocità medio-bassa','Ferma se l’impasto si scalda, si strappa o si avvolge troppo sul gancio.');add(0,'Controllo finale impasto','Pronto quando è più liscio, elastico, pulisce in parte la ciotola e forma un velo senza strapparsi subito. Obiettivo circa 24 °C.');return{steps,end:t}}
function generate(){try{const p=presets[$('#style').value],flour=Number($('#flourWeight').value),target=new Date($('#targetMeal').value);if(!flour||flour<100)throw new Error('Inserisci almeno 100 g di farina.');if(!isFinite(target))throw new Error('Scegli data e ora del pasto.');const hours=(target-Date.now())/3600000;if(hours<4)throw new Error('Servono almeno 4 ore.');const room=Number(env()?.room_temperature_c||22),fridge=Number(env()?.fridge_temperature_c??4),device=appliances[$('#ovenType').value];let bulk=p.bulk,proof=p.proof,cold=Math.max(0,Math.floor(hours*60)-bulk-proof-90);if(hours<10||cold<240){cold=0;bulk=Math.max(90,Math.floor(hours*60)-proof-90)}let yeastPct=p.baseFresh*(24/Math.max(hours,4))*Math.pow(1.12,22-room);if($('#yeastType').value==='dry_yeast')yeastPct*=.4;if($('#yeastType').value==='sourdough')yeastPct=Math.min(25,Math.max(10,15*(24/Math.max(hours,4))));const water=flour*p.hydration/100,salt=flour*p.salt/100,yeast=flour*yeastPct/100,oven=Math.min(p.idealOven,device.max),bake=p.bake+(oven<p.idealOven?3:0);const bakeStart=new Date(target-bake*60000),preheat=new Date(bakeStart-device.preheat*60000),proofStart=new Date(preheat-proof*60000),coldStart=new Date(proofStart-cold*60000),bulkEnd=new Date(coldStart),mixStart=new Date(bulkEnd-bulk*60000-35*60000);const mix=mixerSteps(mixStart,p,water,$('#yeastType').value);const steps=[...mix.steps,{label:`Inizio puntata (${bulk} min)`,detail:'Trasferisci in contenitore leggermente unto e copri.',at:mix.end},{label:'Prima piega',detail:'Dopo 30–40 minuti: piega delicata per dare struttura.',at:new Date(mix.end.getTime()+35*60000)},{label:'Fine puntata',detail:cold?'Metti in frigorifero ben coperto.':'Procedi alla formatura o alla teglia.',at:bulkEnd},{label:cold?`Fermentazione in frigo (${(cold/60).toFixed(1)} h)`:'Nessun passaggio in frigo',detail:cold?`Frigo previsto a ${fridge} °C.`:'Mantieni a temperatura ambiente.',at:cold?coldStart:proofStart},{label:`Inizio appretto (${proof} min)`,detail:'Forma, stendi o sistema in teglia senza sgonfiare eccessivamente.',at:proofStart},{label:`Accendi ${device.label}`,detail:`Imposta ${oven} °C e preriscalda per ${device.preheat} minuti.`,at:preheat},{label:`Inforna a ${oven} °C`,detail:`Cottura indicativa ${bake} minuti; controlla fondo dorato e superficie ben colorita.`,at:bakeStart},{label:'Pronto da mangiare',detail:'Lascia assestare 2–5 minuti prima del taglio.',at:target}];plan={owner_user_id:owner,environment_profile_id:$('#environmentProfile').value||null,title:`${p.name} — ${fmt(target)}`,product_style:$('#style').value,status:'planned',flour_name:$('#flourName').value.trim()||null,flour_weight_g:flour,yeast_type:$('#yeastType').value,target_meal_at:target.toISOString(),hydration_percent:p.hydration,water_weight_g:+water.toFixed(1),salt_weight_g:+salt.toFixed(1),yeast_weight_g:+yeast.toFixed(2),bulk_fermentation_minutes:bulk,cold_fermentation_minutes:cold,final_proof_minutes:proof,target_dough_temperature_c:24,oven_type:$('#ovenType').value,oven_temperature_c:oven,generated_plan:steps.map(s=>({label:s.label,detail:s.detail,at:s.at.toISOString()}))};$('#summary').textContent=`${p.name}, ${flour} g di farina, ${hours.toFixed(1)} ore disponibili, ambiente ${room} °C e frigo ${fridge} °C.`;$('#water').textContent=plan.water_weight_g+' g';$('#salt').textContent=plan.salt_weight_g+' g';$('#yeast').textContent=plan.yeast_weight_g+' g';$('#hydration').textContent=p.hydration+'%';$('#bake').textContent=oven+' °C · '+bake+' min';$('#ovenNote').textContent=device.note;$('#timeline').innerHTML=steps.map(s=>`<div class="step"><strong>${fmt(s.at)} — ${s.label}</strong><small>${s.detail||''}</small></div>`).join('');$('#proposal').hidden=false;msg('Sessione completa generata. Controlla e salva.','ok')}catch(e){msg(e.message,'error')}}
async function save(){try{if(!plan)generate();if(!plan)throw new Error('Genera prima la sessione.');const{error}=await c.from('baking_sessions').insert(plan);if(error)throw error;msg('Sessione salvata nel Laboratorio.','ok')}catch(e){msg(e.message,'error')}}async function init(){try{const{data,error}=await c.auth.getSession();if(error)throw error;if(!data.session?.user)throw new Error('Accedi prima di continuare.');owner=data.session.user.id;const r=await c.from('fermentation_environment_profiles').select('*').eq('owner_user_id',owner).order('is_default',{ascending:false}).order('name');if(r.error)throw r.error;environments=r.data||[];$('#environmentProfile').innerHTML='<option value="">Nessun profilo</option>'+environments.map(x=>`<option value="${x.id}">${x.name}${x.is_default?' — predefinito':''}</option>`).join('');$('#environmentProfile').value=environments.find(x=>x.is_default)?.id||'';defaultDate();msg('Pronto.','ok')}catch(e){msg(e.message,'error')}}$('#generate').onclick=generate;$('#save').onclick=save;$('#reset').onclick=()=>{plan=null;$('#proposal').hidden=true;$('#flourName').value='';$('#flourWeight').value=1000;defaultDate();msg('Nuova sessione.','muted')};init();
</script></body></html>
