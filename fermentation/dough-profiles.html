<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profili impasto — Cucina Hub</title><style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#26221d}main{max-width:1050px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}button{border:0;background:#365d44;color:#fff;font-weight:800}.secondary{background:#eee8df;color:#26221d}.danger{background:#9f2d2d}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{width:auto}.muted{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}.suggestion{background:#f2f7f3;border:1px solid #bdd1c2;border-radius:14px;padding:16px;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#fff;border:1px solid #d7e4da;border-radius:10px;padding:10px}.metric strong{display:block;font-size:1.15rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{border:1px solid #e5ded4;border-radius:14px;padding:14px}.advanced summary{cursor:pointer;font-weight:800;padding:14px 0}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><h1>Profili impasto</h1><p class="muted">Inserisci solo cosa vuoi preparare, quanta farina usi, il tuo ambiente, il lievito disponibile e quando vuoi mangiare.</p><section class="panel"><h2 id="formTitle">Crea un impasto guidato</h2><input id="profileId" type="hidden"><div class="grid"><div class="full"><label>Cosa vuoi preparare?</label><select id="style"><option value="roman_pan">Pizza in teglia romana</option><option value="neapolitan">Pizza napoletana</option><option value="home_round">Pizza tonda nel forno di casa</option><option value="focaccia">Focaccia</option><option value="bread">Pane</option></select></div><div><label>Farina totale (g)</label><input id="flourWeight" type="number" min="100" step="10" value="1000"></div><div><label>Ambiente</label><select id="environmentProfile"></select></div><div><label>Lievito disponibile</label><select id="yeastType"><option value="fresh_yeast">Lievito fresco</option><option value="dry_yeast">Lievito secco</option><option value="sourdough">Lievito madre</option><option value="none">Nessuno</option></select></div><div><label>Quando vuoi mangiare?</label><input id="readyAt" type="datetime-local"></div><div class="full actions"><button id="generate" type="button">GENERA PROPOSTA</button><button id="reset" class="secondary" type="button">NUOVO</button></div></div><div id="suggestion" class="suggestion" hidden><h3>Proposta Cucina Hub</h3><p id="summary"></p><div class="metrics"><div class="metric">Idratazione<strong id="mHydration"></strong></div><div class="metric">Lievito<strong id="mYeast"></strong></div><div class="metric">Puntata<strong id="mBulk"></strong></div><div class="metric">Frigo<strong id="mCold"></strong></div><div class="metric">Appretto<strong id="mProof"></strong></div></div></div><details class="advanced"><summary>Mostra e modifica i dettagli tecnici</summary><div class="grid"><div><label>Nome profilo</label><input id="name"></div><div><label>Tipo</label><select id="doughType"><option value="pizza">Pizza</option><option value="bread">Pane</option><option value="focaccia">Focaccia</option></select></div><div><label>Idratazione (%)</label><input id="hydration" type="number" step="0.1"></div><div><label>Temperatura impasto (°C)</label><input id="targetDoughTemp" type="number" step="0.1"></div><div><label>Lievito (% panificatore)</label><input id="yeastPercent" type="number" step="0.0001"></div><div><label>Puntata (minuti)</label><input id="bulkMinutes" type="number"></div><div><label>Temperatura puntata (°C)</label><input id="bulkTemp" type="number" step="0.1"></div><div><label>Frigo (minuti)</label><input id="coldMinutes" type="number"></div><div><label>Temperatura frigo (°C)</label><input id="fridgeTemp" type="number" step="0.1"></div><div><label>Appretto (minuti)</label><input id="finalProofMinutes" type="number"></div><div><label>Temperatura appretto (°C)</label><input id="finalProofTemp" type="number" step="0.1"></div><div><label><input id="isDefault" type="checkbox" style="width:auto"> Profilo predefinito</label></div><div class="full"><label>Note</label><textarea id="notes"></textarea></div></div></details><div class="actions" style="margin-top:14px"><button id="save">SALVA PROFILO</button></div><p id="status" class="muted">In attesa.</p></section><section class="panel"><h2>Profili salvati</h2><div id="cards" class="cards"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script>const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);let owner,profiles=[],environments=[];const f={id:$('#profileId'),style:$('#style'),flourWeight:$('#flourWeight'),environmentProfile:$('#environmentProfile'),yeastType:$('#yeastType'),readyAt:$('#readyAt'),name:$('#name'),doughType:$('#doughType'),hydration:$('#hydration'),targetDoughTemp:$('#targetDoughTemp'),yeastPercent:$('#yeastPercent'),bulkMinutes:$('#bulkMinutes'),bulkTemp:$('#bulkTemp'),coldMinutes:$('#coldMinutes'),fridgeTemp:$('#fridgeTemp'),finalProofMinutes:$('#finalProofMinutes'),finalProofTemp:$('#finalProofTemp'),isDefault:$('#isDefault'),notes:$('#notes')};const status=$('#status'),cards=$('#cards'),suggestion=$('#suggestion');const presets={roman_pan:{name:'Pizza in teglia romana',type:'pizza',hydration:80,target:24,bulk:120,proof:180,base:0.15,notes:'Alta idratazione, pieghe in puntata e stesura delicata.'},neapolitan:{name:'Pizza napoletana',type:'pizza',hydration:65,target:24,bulk:120,proof:240,base:0.10,notes:'Panetti prima dell’appretto e stesura senza mattarello.'},home_round:{name:'Pizza tonda forno casa',type:'pizza',hydration:68,target:24,bulk:120,proof:180,base:0.18,notes:'Adatta a pietra o teglia nel forno domestico.'},focaccia:{name:'Focaccia',type:'focaccia',hydration:75,target:25,bulk:120,proof:150,base:0.25,notes:'Riposo in teglia, salamoia e fossette prima della cottura.'},bread:{name:'Pane',type:'bread',hydration:70,target:24,bulk:180,proof:150,base:0.20,notes:'Pieghe, formatura e incisione prima della cottura.'}};function msg(t,k='muted'){status.className=k;status.textContent=t}async function user(){const{data,error}=await c.auth.getSession();if(error)throw error;if(!data.session?.user)throw new Error('Accedi prima di continuare.');return data.session.user}function env(){return environments.find(x=>x.id===f.environmentProfile.value)}function defaultDate(){const d=new Date(Date.now()+86400000);d.setHours(20,0,0,0);f.readyAt.value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function reset(){f.id.value='';f.style.value='roman_pan';f.flourWeight.value=1000;f.environmentProfile.value=environments.find(x=>x.is_default)?.id||'';f.yeastType.value='fresh_yeast';defaultDate();['name','hydration','targetDoughTemp','yeastPercent','bulkMinutes','bulkTemp','coldMinutes','fridgeTemp','finalProofMinutes','finalProofTemp','notes'].forEach(x=>f[x].value='');f.isDefault.checked=false;suggestion.hidden=true;$('#formTitle').textContent='Crea un impasto guidato';msg('Inserisci i dati essenziali e genera la proposta.')}function hours(){const h=(new Date(f.readyAt.value)-Date.now())/3600000;if(!isFinite(h)||h<3)throw new Error('Scegli un orario almeno 3 ore più avanti.');return h}function generate(){try{const p=presets[f.style.value],h=hours(),e=env(),room=Number(e?.room_temperature_c||22),fridge=Number(e?.fridge_temperature_c??4),available=Math.floor(h*60);let proof=p.proof,bulk=p.bulk,cold=Math.max(0,available-bulk-proof-90);if(h<10||cold<240){cold=0;bulk=Math.max(90,available-proof-90)}let y=p.base*(24/Math.max(h,4))*Math.pow(1.12,22-room);if(f.yeastType.value==='dry_yeast')y*=.4;if(f.yeastType.value==='sourdough')y=Math.min(25,Math.max(10,15*(24/Math.max(h,4))));if(f.yeastType.value==='none')y=0;y=Math.round(y*10000)/10000;Object.assign(f.name,{value:`${p.name} — ${Math.round(h)}h`});f.doughType.value=p.type;f.hydration.value=p.hydration;f.targetDoughTemp.value=p.target;f.yeastPercent.value=y;f.bulkMinutes.value=bulk;f.bulkTemp.value=room;f.coldMinutes.value=cold;f.fridgeTemp.value=fridge;f.finalProofMinutes.value=proof;f.finalProofTemp.value=room;f.notes.value=p.notes;$('#summary').textContent=`Per ${f.flourWeight.value} g di farina, ${h.toFixed(1)} ore disponibili e ambiente a ${room} °C.`;$('#mHydration').textContent=p.hydration+'%';$('#mYeast').textContent=y+'%';$('#mBulk').textContent=(bulk/60).toFixed(1)+' h';$('#mCold').textContent=cold?(cold/60).toFixed(1)+' h':'Nessuno';$('#mProof').textContent=(proof/60).toFixed(1)+' h';suggestion.hidden=false;msg('Proposta generata.','ok')}catch(e){msg(e.message,'error')}}function target(){const d=new Date(f.readyAt.value),n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),b=new Date(d.getFullYear(),d.getMonth(),d.getDate());return{time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,offset:Math.max(0,Math.round((b-a)/86400000))}}function render(){cards.innerHTML=profiles.length?profiles.map(p=>`<article class="card"><h3>${p.name}</h3><p>${p.flour_weight_g} g · ${p.target_hydration_percent}%</p><p class="muted">Puntata ${p.bulk_fermentation_minutes} min · Frigo ${p.cold_fermentation_minutes} min · Appretto ${p.final_proof_minutes} min</p><div class="actions"><button class="secondary" onclick="editP('${p.id}')">Modifica</button><button class="danger" onclick="delP('${p.id}')">Elimina</button></div></article>`).join(''):'<p>Nessun profilo salvato.</p>'}async function load(){let r=await c.from('fermentation_environment_profiles').select('*').eq('owner_user_id',owner).order('is_default',{ascending:false});if(r.error)throw r.error;environments=r.data||[];f.environmentProfile.innerHTML='<option value="">Nessun profilo</option>'+environments.map(x=>`<option value="${x.id}">${x.name}${x.is_default?' — predefinito':''}</option>`).join('');r=await c.from('fermentation_dough_profiles').select('*').eq('owner_user_id',owner).order('is_default',{ascending:false}).order('name');if(r.error)throw r.error;profiles=r.data||[];render()}function editP(id){const p=profiles.find(x=>x.id===id);if(!p)return;f.id.value=p.id;f.name.value=p.name;f.doughType.value=p.dough_type;f.flourWeight.value=p.flour_weight_g;f.environmentProfile.value=p.environment_profile_id||'';f.yeastType.value=p.yeast_type;f.hydration.value=p.target_hydration_percent;f.targetDoughTemp.value=p.target_dough_temperature_c??'';f.yeastPercent.value=p.yeast_baker_percent??'';f.bulkMinutes.value=p.bulk_fermentation_minutes;f.bulkTemp.value=p.bulk_fermentation_temperature_c??'';f.coldMinutes.value=p.cold_fermentation_minutes;f.fridgeTemp.value=p.fridge_temperature_c??'';f.finalProofMinutes.value=p.final_proof_minutes;f.finalProofTemp.value=p.final_proof_temperature_c??'';f.isDefault.checked=p.is_default;f.notes.value=p.notes||'';const d=new Date();d.setDate(d.getDate()+p.target_ready_day_offset);const[t,m]=String(p.target_ready_time||'20:00').split(':');d.setHours(+t,+m,0,0);f.readyAt.value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('#formTitle').textContent='Modifica profilo impasto';scrollTo({top:0,behavior:'smooth'})}async function delP(id){if(!confirm('Eliminare questo profilo?'))return;const{error}=await c.from('fermentation_dough_profiles').delete().eq('id',id).eq('owner_user_id',owner);if(error)return msg(error.message,'error');await load();reset()}$('#generate').onclick=generate;$('#reset').onclick=reset;$('#save').onclick=async()=>{try{if(!f.name.value)generate();const t=target(),row={owner_user_id:owner,environment_profile_id:f.environmentProfile.value||null,name:f.name.value,dough_type:f.doughType.value,description:'Profilo guidato',is_default:f.isDefault.checked,flour_weight_g:+f.flourWeight.value,target_hydration_percent:+f.hydration.value,target_dough_temperature_c:+f.targetDoughTemp.value||null,yeast_type:f.yeastType.value,yeast_baker_percent:+f.yeastPercent.value||0,preferment_type:f.yeastType.value==='sourdough'?'sourdough':'none',preferment_flour_percent:f.yeastType.value==='sourdough'?15:0,bulk_fermentation_minutes:+f.bulkMinutes.value||0,bulk_fermentation_temperature_c:+f.bulkTemp.value||null,cold_fermentation_minutes:+f.coldMinutes.value||0,fridge_temperature_c:+f.fridgeTemp.value||null,final_proof_minutes:+f.finalProofMinutes.value||0,final_proof_temperature_c:+f.finalProofTemp.value||null,target_ready_time:t.time,target_ready_day_offset:t.offset,notes:f.notes.value||null,updated_at:new Date().toISOString()};if(row.is_default){let q=c.from('fermentation_dough_profiles').update({is_default:false}).eq('owner_user_id',owner).eq('is_default',true);if(f.id.value)q=q.neq('id',f.id.value);const{error}=await q;if(error)throw error}const q=f.id.value?c.from('fermentation_dough_profiles').update(row).eq('id',f.id.value):c.from('fermentation_dough_profiles').insert(row);const{error}=await q;if(error)throw error;await load();reset();msg('Profilo salvato.','ok')}catch(e){msg(e.message,'error')}};window.editP=editP;window.delP=delP;(async()=>{try{owner=(await user()).id;await load();reset()}catch(e){msg(e.message,'error')}})();</script></body></html>
