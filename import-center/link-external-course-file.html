<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collega file esterno — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:920px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 6px}select,input,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}textarea{min-height:90px}button{margin-top:14px;border:0;background:#365d44;color:#fff;font-weight:800}button:disabled{opacity:.5}.muted{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:520px;overflow:auto}</style></head><body><main><h1>Collega file esterno</h1><p class="muted">Registra un file conservato su iCloud Drive o su un altro archivio senza caricarlo su Supabase.</p><section class="panel"><label>Corso</label><select id="course"><option>Caricamento…</option></select><label>Categoria</label><select id="category"><option>Seleziona prima il corso</option></select><label>Contenuto</label><select id="content"><option>Seleziona prima la categoria</option></select><label>Provider</label><select id="provider"><option value="icloud">iCloud Drive</option><option value="google_drive">Google Drive</option><option value="dropbox">Dropbox</option><option value="onedrive">OneDrive</option><option value="nas">NAS</option><option value="generic">URL generico</option></select><label>Nome visualizzato</label><input id="name" placeholder="Glossario di cucina - A-M"><label>Link condiviso</label><input id="url" type="url" placeholder="https://www.icloud.com/..."><label>Ruolo</label><select id="role"><option value="primary">Principale</option><option value="supplementary">Supplementare</option><option value="transcript">Trascrizione</option><option value="thumbnail">Miniatura</option><option value="cover">Copertina</option></select><label>Tipo MIME facoltativo</label><input id="mime" placeholder="application/pdf oppure video/mp4"><label>Dimensione in byte facoltativa</label><input id="size" type="number" min="0" step="1"><label>Note</label><textarea id="notes" placeholder="File oltre 50 MB conservato nella cartella iCloud del corso."></textarea><button id="save">COLLEGA FILE ESTERNO</button><p id="status" class="muted">In attesa.</p></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);const course=$('#course'),category=$('#category'),content=$('#content'),provider=$('#provider'),name=$('#name'),url=$('#url'),role=$('#role'),mime=$('#mime'),size=$('#size'),notes=$('#notes'),save=$('#save'),status=$('#status'),log=$('#log');let owner=null;const check=(e,x)=>{if(e)throw new Error(`${x}: ${e.message}`)};async function getUser(){const{data,error}=await c.auth.getSession();check(error,'Sessione');if(!data.session?.user)throw new Error('Accedi prima di continuare.');return data.session.user}async function loadCourses(){try{owner=(await getUser()).id;const{data,error}=await c.from('courses').select('id,title').eq('owner_user_id',owner).order('title');check(error,'Corsi');course.innerHTML='<option value="">Seleziona…</option>'+((data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join(''))}catch(e){status.className='error';status.textContent=e.message}}async function loadCategories(){content.innerHTML='<option value="">Seleziona prima la categoria</option>';if(!course.value){category.innerHTML='<option value="">Seleziona prima il corso</option>';return}const{data,error}=await c.from('course_categories').select('id,name').eq('owner_user_id',owner).eq('course_id',course.value).order('sort_order').order('name');if(error){status.className='error';status.textContent=error.message;return}category.innerHTML='<option value="">Seleziona…</option>'+((data||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join(''))}async function loadContents(){if(!category.value){content.innerHTML='<option value="">Seleziona prima la categoria</option>';return}const{data,error}=await c.from('course_contents').select('id,title,source_filename').eq('owner_user_id',owner).eq('category_id',category.value).order('sort_order').order('title');if(error){status.className='error';status.textContent=error.message;return}content.innerHTML='<option value="">Seleziona…</option>'+((data||[]).map(x=>`<option value="${x.id}">${x.title}${x.source_filename?` — ${x.source_filename}`:''}</option>`).join(''))}course.onchange=loadCategories;category.onchange=loadContents;save.onclick=async()=>{save.disabled=true;status.className='muted';status.textContent='Salvataggio…';try{if(!content.value)throw new Error('Seleziona un contenuto.');const link=url.value.trim();if(!/^https?:\/\//i.test(link))throw new Error('Inserisci un link HTTP o HTTPS valido.');if(!name.value.trim())throw new Error('Inserisci il nome visualizzato.');const row={owner_user_id:owner,content_id:content.value,provider:provider.value,external_url:link,display_name:name.value.trim(),file_role:role.value,mime_type:mime.value.trim()||null,size_bytes:size.value?Number(size.value):null,notes:notes.value.trim()||null};const{data,error}=await c.from('course_content_external_links').upsert(row,{onConflict:'content_id,external_url'}).select('*').single();check(error,'Collegamento');const report={pass:true,id:data.id,content_id:data.content_id,provider:data.provider,display_name:data.display_name,external_url:data.external_url,file_role:data.file_role};log.textContent=`REPORT FINALE\n${JSON.stringify(report,null,2)}`;status.className='ok';status.textContent='File esterno collegato.'}catch(e){status.className='error';status.textContent=e.message;log.textContent=`ERRORE COMPLETO\n${e.stack||e.message}`}finally{save.disabled=false}};loadCourses();</script></body></html>
