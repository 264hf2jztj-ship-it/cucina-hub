<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivio esterno corso — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:920px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 6px}select,input,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}textarea{min-height:90px}button{margin-top:14px;border:0;background:#365d44;color:#fff;font-weight:800}.muted{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px}</style></head><body><main><h1>Archivio esterno del corso</h1><p class="muted">Registra un solo link condiviso per ciascuna cartella iCloud. I contenuti useranno il proprio percorso relativo; con iCloud il pulsante apre la cartella, non costruisce un link diretto al singolo file.</p><section class="panel"><label>Corso</label><select id="course"><option>Caricamento…</option></select><label>Categoria</label><select id="category"><option>Seleziona prima il corso</option></select><label>Provider</label><select id="provider"><option value="icloud">iCloud Drive</option><option value="nextcloud">Nextcloud</option><option value="onedrive">OneDrive</option><option value="google_drive">Google Drive</option><option value="dropbox">Dropbox</option><option value="nas">NAS</option><option value="generic">Generico</option></select><label>Nome sorgente</label><input id="name" placeholder="Es. Corso Barbieri — Video lezioni"><label>Link condiviso della cartella</label><input id="url" type="url" placeholder="https://www.icloud.com/iclouddrive/..."><label>Percorso base facoltativo</label><input id="basePath" placeholder="Es. 02_Video Lezioni"><label>Note</label><textarea id="notes" placeholder="Es. File oltre 50 MB e video originali"></textarea><button id="save">SALVA O AGGIORNA SORGENTE</button><p id="status" class="muted">In attesa.</p></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script>const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);const course=$('#course'),category=$('#category'),provider=$('#provider'),name=$('#name'),url=$('#url'),basePath=$('#basePath'),notes=$('#notes'),status=$('#status'),log=$('#log');let owner=null;const check=(e,cx)=>{if(e)throw new Error(`${cx}: ${e.message}`)};async function init(){try{const{data,error}=await c.auth.getSession();check(error,'Sessione');if(!data.session?.user)throw new Error('Accedi prima di continuare.');owner=data.session.user.id;const r=await c.from('courses').select('id,title').eq('owner_user_id',owner).order('title');check(r.error,'Corsi');course.innerHTML='<option value="">Seleziona…</option>'+r.data.map(x=>`<option value="${x.id}">${x.title}</option>`).join('')}catch(e){status.className='error';status.textContent=e.message}}async function loadCategories(){category.innerHTML='<option value="">Caricamento…</option>';if(!course.value){category.innerHTML='<option value="">Seleziona prima il corso</option>';return}const r=await c.from('course_categories').select('id,name').eq('owner_user_id',owner).eq('course_id',course.value).order('sort_order').order('name');if(r.error){status.className='error';status.textContent=r.error.message;return}category.innerHTML='<option value="">Seleziona…</option>'+r.data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}course.onchange=loadCategories;category.onchange=()=>{if(course.selectedOptions[0]&&category.selectedOptions[0])name.value=`${course.selectedOptions[0].textContent} — ${category.selectedOptions[0].textContent}`};$('#save').onclick=async()=>{try{if(!course.value||!category.value)throw new Error('Seleziona corso e categoria.');if(!name.value.trim())throw new Error('Inserisci il nome della sorgente.');if(!/^https?:\/\//i.test(url.value.trim()))throw new Error('Inserisci un link http o https valido.');const row={owner_user_id:owner,course_id:course.value,category_id:category.value,provider:provider.value,display_name:name.value.trim(),folder_url:url.value.trim(),base_path:basePath.value.trim()||null,notes:notes.value.trim()||null,updated_at:new Date().toISOString()};const r=await c.from('course_external_sources').upsert(row,{onConflict:'owner_user_id,course_id,category_id'}).select('*').single();check(r.error,'Salvataggio');status.className='ok';status.textContent='Sorgente esterna salvata.';log.textContent='REPORT FINALE\n'+JSON.stringify({pass:true,id:r.data.id,course_id:r.data.course_id,category_id:r.data.category_id,provider:r.data.provider,display_name:r.data.display_name,folder_url:r.data.folder_url,behavior:'open_folder_and_show_relative_filename'},null,2)}catch(e){status.className='error';status.textContent=e.message;log.textContent='ERRORE COMPLETO\n'+(e.stack||e.message)}};init();</script></body></html>
