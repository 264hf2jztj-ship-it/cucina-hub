<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import reale corso — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 6px}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}button{margin-top:14px;border:0;background:#365d44;color:#fff;font-weight:800}.danger{background:#9f2f2f}.muted{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px}.hidden{display:none}</style></head><body><main><h1>Import reale corso</h1><p class="muted">Crea o aggiorna corso, categoria e contenuti. In questo incremento i file non vengono ancora caricati nello Storage.</p><section class="panel"><label for="mode">Modalità</label><select id="mode"><option value="new">Nuovo corso</option><option value="update">Aggiorna corso esistente</option></select><div id="newFields"><label for="title">Titolo corso</label><input id="title" value="Corso Barbieri"></div><div id="existingWrap" class="hidden"><label for="existing">Corso esistente</label><select id="existing"><option>Caricamento…</option></select></div><label for="category">Categoria da creare/aggiornare</label><input id="category" placeholder="Dispense"><label for="zip">Archivio ZIP</label><input id="zip" type="file" accept=".zip,application/zip"><button id="analyze">Analizza</button><p id="status" class="muted">In attesa.</p></section><section id="preview" class="panel hidden"><h2>Anteprima</h2><div id="summary"></div><button id="import" class="danger">IMPORTA DATI</button><p class="muted">L’azione scrive su Supabase. I file fisici saranno caricati nel sottostep successivo.</p></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);const mode=$('#mode'),title=$('#title'),existing=$('#existing'),existingWrap=$('#existingWrap'),newFields=$('#newFields'),category=$('#category'),zipInput=$('#zip'),analyze=$('#analyze'),importBtn=$('#import'),preview=$('#preview'),summary=$('#summary'),status=$('#status'),log=$('#log');let parsed=[];const video=new Set(['mp4','mov','m4v','webm','avi','mkv']),images=new Set(['jpg','jpeg','png','webp','heic']);const clean=v=>String(v||'').replace(/^\s*\d+[\s._-]*/,'').replace(/[_-]+/g,' ').replace(/\.[^.]+$/,'').trim();const slug=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const typeOf=n=>{const e=(n.split('.').pop()||'').toLowerCase();if(e==='pdf')return'pdf';if(video.has(e))return'video';if(images.has(e))return'image';return'other'};async function user(){const{data,error}=await c.auth.getSession();if(error)throw error;if(!data.session?.user)throw new Error('Accedi prima di importare.');return data.session.user}async function loadCourses(){try{const u=await user();const{data,error}=await c.from('courses').select('id,title').eq('owner_user_id',u.id).order('title');if(error)throw error;existing.innerHTML=(data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join('')||'<option value="">Nessun corso</option>'}catch(e){status.className='error';status.textContent=e.message}}mode.onchange=()=>{const up=mode.value==='update';existingWrap.classList.toggle('hidden',!up);newFields.classList.toggle('hidden',up)};analyze.onclick=async()=>{try{const f=zipInput.files?.[0];if(!f)throw new Error('Seleziona uno ZIP.');const z=await JSZip.loadAsync(f);parsed=Object.values(z.files).filter(x=>!x.dir&&!x.name.includes('__MACOSX')&&!x.name.split('/').pop().startsWith('.')).map((x,i)=>{const filename=x.name.split('/').pop();return{title:clean(filename),content_type:typeOf(filename),source_filename:filename,source_path:x.name,sort_order:i}}).filter(x=>x.content_type!=='other');if(!category.value)category.value=clean(f.name);summary.textContent=`${parsed.length} contenuti riconosciuti nella categoria “${category.value}”.`;preview.classList.remove('hidden');status.className='ok';status.textContent='Anteprima pronta.';log.textContent=JSON.stringify({mode:'preview',content_count:parsed.length,category:category.value,writes_performed:0},null,2)}catch(e){status.className='error';status.textContent=e.message;log.textContent=e.stack||e.message}};importBtn.onclick=async()=>{importBtn.disabled=true;try{const u=await user();if(!parsed.length)throw new Error('Esegui prima l’analisi.');let courseId=existing.value,courseCreated=false;if(mode.value==='new'){if(!title.value.trim())throw new Error('Inserisci il titolo del corso.');const courseTitle=title.value.trim();const{data:found,error:findError}=await c.from('courses').select('id').eq('owner_user_id',u.id).eq('title',courseTitle).limit(1);if(findError)throw findError;if(found?.[0]?.id){courseId=found[0].id}else{const{data,error}=await c.from('courses').insert({owner_user_id:u.id,title:courseTitle}).select('id').single();if(error)throw error;courseId=data.id;courseCreated=true}}else if(!courseId)throw new Error('Seleziona un corso esistente.');const catSlug=slug(category.value);const{data:cats,error:ce}=await c.from('course_categories').select('id').eq('owner_user_id',u.id).eq('course_id',courseId).eq('slug',catSlug).limit(1);if(ce)throw ce;let categoryId=existingCategory(cats),categoryCreated=false;function existingCategory(rows){return rows?.[0]?.id||null}if(!categoryId){const{data,error}=await c.from('course_categories').insert({owner_user_id:u.id,course_id:courseId,name:category.value.trim(),slug:catSlug}).select('id').single();if(error)throw error;categoryId=data.id;categoryCreated=true}const{data:old,error:oe}=await c.from('course_contents').select('source_path').eq('owner_user_id',u.id).eq('course_id',courseId);if(oe)throw oe;const known=new Set((old||[]).map(x=>x.source_path));const fresh=parsed.filter(x=>!known.has(x.source_path)).map(x=>({...x,owner_user_id:u.id,course_id:courseId,category_id:categoryId}));let inserted=[];if(fresh.length){const{data,error}=await c.from('course_contents').insert(fresh).select('id,content_code,title');if(error)throw error;inserted=data||[]}const report={pass:true,course_id:courseId,course_created:courseCreated,category_id:categoryId,category_created:categoryCreated,contents_detected:parsed.length,contents_created:inserted.length,contents_skipped_existing:parsed.length-inserted.length,first_codes:inserted.slice(0,5).map(x=>x.content_code),storage_uploads:0};log.textContent=`REPORT FINALE\n${JSON.stringify(report,null,2)}`;status.className='ok';status.textContent='Importazione dati completata.';await loadCourses()}catch(e){status.className='error';status.textContent=e.message;log.textContent=`ERRORE COMPLETO\n${e.stack||e.message}`}finally{importBtn.disabled=false}};loadCourses();</script></body></html>
