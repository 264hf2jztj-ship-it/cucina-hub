<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload file corso — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 6px}select,input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #bbb2a6;font:inherit}button{margin-top:14px;border:0;background:#365d44;color:#fff;font-weight:800}button:disabled{opacity:.5}.muted{color:#6d655c}.ok{color:#1b6b36}.error{color:#a62424}progress{width:100%;height:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:520px;overflow:auto}</style></head><body><main><h1>Upload file corso</h1><p class="muted">Carica PDF e immagini dal file ZIP nel bucket privato <strong>course-assets</strong> e li collega ai contenuti già registrati.</p><section class="panel"><label>Corso</label><select id="course"><option>Caricamento…</option></select><label>Categoria</label><select id="category"><option>Seleziona prima il corso</option></select><label>Archivio ZIP</label><input id="zip" type="file" accept=".zip,application/zip"><button id="analyze">Analizza ZIP</button><p id="status" class="muted">In attesa.</p></section><section class="panel"><h2>Avanzamento</h2><progress id="progress" value="0" max="1"></progress><p id="counter" class="muted">0 / 0</p><button id="upload" disabled>CARICA E COLLEGA FILE</button></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">const c=window.cucinaHubSupabase,$=s=>document.querySelector(s);const course=$('#course'),category=$('#category'),zipInput=$('#zip'),analyze=$('#analyze'),upload=$('#upload'),status=$('#status'),progress=$('#progress'),counter=$('#counter'),log=$('#log');let entries=[],owner=null;const imageExt=new Set(['jpg','jpeg','png','webp','heic','heif']);const slug=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const typeOf=n=>{const e=(n.split('.').pop()||'').toLowerCase();if(e==='pdf')return'application/pdf';if(imageExt.has(e))return e==='jpg'||e==='jpeg'?'image/jpeg':`image/${e}`;return null};const check=(e,cx)=>{if(e)throw new Error(`${cx}: ${e.message}`)};async function user(){const{data,error}=await c.auth.getSession();check(error,'Sessione');if(!data.session?.user)throw new Error('Accedi prima di continuare.');return data.session.user}async function col(names,required=false){for(const n of names){const{error}=await c.from('storage_files').select(n).limit(1);if(!error)return n;const t=(error.message||'').toLowerCase();if(!(error.code==='42703'||t.includes('column')))throw error}if(required)throw new Error(`Colonna storage_files non trovata: ${names.join(', ')}`);return null}async function storageSchema(){return{id:await col(['id'],true),owner:await col(['owner_user_id','user_id'],true),bucket:await col(['bucket_id','bucket_name','bucket'],true),path:await col(['object_path','storage_path','path'],true),filename:await col(['original_filename','file_name','filename']),mime:await col(['mime_type','content_type']),size:await col(['size_bytes','file_size','bytes'])}}async function loadCourses(){try{owner=(await user()).id;const{data,error}=await c.from('courses').select('id,title').eq('owner_user_id',owner).order('title');check(error,'Corsi');course.innerHTML='<option value="">Seleziona…</option>'+((data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join(''));}catch(e){status.className='error';status.textContent=e.message}}async function loadCategories(){category.innerHTML='<option value="">Caricamento…</option>';if(!course.value){category.innerHTML='<option value="">Seleziona prima il corso</option>';return}const{data,error}=await c.from('course_categories').select('id,name,slug').eq('course_id',course.value).eq('owner_user_id',owner).order('sort_order').order('name');if(error){status.className='error';status.textContent=error.message;return}category.innerHTML='<option value="">Seleziona…</option>'+((data||[]).map(x=>`<option value="${x.id}" data-slug="${x.slug}">${x.name}</option>`).join(''))}course.onchange=loadCategories;analyze.onclick=async()=>{try{const f=zipInput.files?.[0];if(!course.value)throw new Error('Seleziona un corso.');if(!category.value)throw new Error('Seleziona una categoria.');if(!f)throw new Error('Seleziona uno ZIP.');const z=await JSZip.loadAsync(f);entries=Object.values(z.files).filter(x=>!x.dir&&!x.name.includes('__MACOSX')&&!x.name.split('/').pop().startsWith('.')).map(x=>({entry:x,path:x.name,filename:x.name.split('/').pop(),mime:typeOf(x.name)})).filter(x=>x.mime);const{data:contents,error}=await c.from('course_contents').select('id,source_path,title').eq('owner_user_id',owner).eq('course_id',course.value).eq('category_id',category.value);check(error,'Contenuti');const byPath=new Map((contents||[]).map(x=>[x.source_path,x]));entries=entries.map(x=>({...x,content:byPath.get(x.path)}));const matched=entries.filter(x=>x.content).length;status.className=matched===entries.length?'ok':'error';status.textContent=`${entries.length} file supportati, ${matched} abbinati ai contenuti.`;log.textContent=JSON.stringify({mode:'preview',file_count:entries.length,matched_count:matched,unmatched_paths:entries.filter(x=>!x.content).map(x=>x.path),writes_performed:0},null,2);upload.disabled=!(entries.length&&matched===entries.length);progress.max=entries.length||1;progress.value=0;counter.textContent=`0 / ${entries.length}`}catch(e){status.className='error';status.textContent=e.message;log.textContent=e.stack||e.message}};upload.onclick=async()=>{upload.disabled=true;analyze.disabled=true;try{const s=await storageSchema();const contentIds=entries.map(x=>x.content.id);const{data:links,error:le}=await c.from('course_content_files').select('content_id').in('content_id',contentIds);check(le,'Collegamenti esistenti');const linked=new Set((links||[]).map(x=>x.content_id));let uploaded=0,skipped=0,failed=[];for(let i=0;i<entries.length;i++){const item=entries[i];progress.value=i;counter.textContent=`${i} / ${entries.length}`;if(linked.has(item.content.id)){skipped++;continue}let objectPath=null;try{const bytes=await item.entry.async('uint8array');const blob=new Blob([bytes],{type:item.mime});const catSlug=category.selectedOptions[0]?.dataset.slug||slug(category.selectedOptions[0]?.textContent);objectPath=`${owner}/courses/${course.value}/${catSlug}/${item.content.id}/${crypto.randomUUID()}-${slug(item.filename.replace(/\.[^.]+$/,''))}.${(item.filename.split('.').pop()||'bin').toLowerCase()}`;const{error:ue}=await c.storage.from('course-assets').upload(objectPath,blob,{contentType:item.mime,cacheControl:'3600',upsert:false});check(ue,'Upload');const row={[s.owner]:owner,[s.bucket]:'course-assets',[s.path]:objectPath};if(s.filename)row[s.filename]=item.filename;if(s.mime)row[s.mime]=item.mime;if(s.size)row[s.size]=blob.size;const{data:sf,error:se}=await c.from('storage_files').insert(row).select('*').single();if(se){await c.storage.from('course-assets').remove([objectPath]);check(se,'storage_files')}const{error:ce}=await c.from('course_content_files').insert({owner_user_id:owner,content_id:item.content.id,storage_file_id:sf[s.id],file_role:'primary'});if(ce){await c.storage.from('course-assets').remove([objectPath]);await c.from('storage_files').delete().eq(s.id,sf[s.id]);check(ce,'course_content_files')}uploaded++}catch(e){failed.push({path:item.path,error:e.message});if(objectPath)await c.storage.from('course-assets').remove([objectPath])}progress.value=i+1;counter.textContent=`${i+1} / ${entries.length}`}const report={pass:failed.length===0,file_count:entries.length,uploaded,skipped_existing:skipped,failed_count:failed.length,failures:failed,bucket:'course-assets'};log.textContent=`REPORT FINALE\n${JSON.stringify(report,null,2)}`;status.className=failed.length?'error':'ok';status.textContent=failed.length?'Upload completato con errori.':'Upload completato.'}catch(e){status.className='error';status.textContent=e.message;log.textContent=`ERRORE COMPLETO\n${e.stack||e.message}`}finally{analyze.disabled=false;upload.disabled=false}};loadCourses();</script></body></html>
