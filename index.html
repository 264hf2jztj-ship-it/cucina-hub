<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="description" content="Cucina Hub: ricette, elettrodomestici, manuali e appunti pratici del progetto Cucina.">
  <title>Cucina Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=14">
  <style>
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body class="auth-locked">
  <a class="skip-link" href="#main-content">Vai al contenuto</a>

  <section
    id="authView"
    class="auth-view"
    aria-labelledby="authTitle"
  >
    <div class="auth-card">
      <div class="auth-brand" aria-hidden="true">🍳</div>

      <p class="eyebrow">Area privata</p>
      <h1 id="authTitle">Accedi a Cucina Hub</h1>

      <p class="auth-description">
        Inserisci le credenziali del tuo account amministratore.
      </p>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            required
          >
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          id="loginButton"
          class="button auth-submit"
          type="submit"
        >
          Accedi
        </button>

        <p
          id="authMessage"
          class="auth-message"
          hidden
          aria-live="polite"
        ></p>
      </form>
    </div>
  </section>

  <header id="appHeader" class="topbar" hidden>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🍳</div>
      <div>
        <p class="eyebrow">Progetto personale</p>
        <h1>Cucina Hub</h1>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="logoutButton" class="button secondary" type="button">Esci</button>
      <button id="menuButton" class="icon-button menu-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Apri menu">☰</button>
    </div>
  </header>

  <div id="appShell" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Navigazione principale">
      <nav id="mainNav" class="nav-list">
        <button class="nav-item is-active" data-view="dashboard" type="button"><span>🏠</span> Dashboard</button>
        <button class="nav-item" data-view="recipes" type="button"><span>📖</span> Ricette</button>
        <button class="nav-item" data-view="hurom" type="button"><span>🥤</span> Hurom</button>
        <button class="nav-item" data-view="ninja" type="button"><span>🥣</span> Ninja</button>
        <a class="nav-item" href="fermentation/index.html?v=1"><span>🍕</span> Pizza e impasti</a>
        <a class="nav-item" href="planner/index.html?v=14"><span>🗓️</span> Planner</a>
        <a class="nav-item" href="knowledge/search.html?v=1"><span>🔎</span> Cerca</a>
        <a class="nav-item" href="knowledge/index.html?v=3"><span>🧠</span> Knowledge</a>
        <button class="nav-item" data-view="appliances" type="button"><span>🔌</span> Elettrodomestici</button>
        <button class="nav-item" data-view="changelog" type="button"><span>🧾</span> Aggiornamenti</button>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Web Edition <strong id="appVersion">1.0</strong></span>
      </div>
    </aside>

    <main id="main-content" class="main-content" tabindex="-1">
      <section id="loadingState" class="loading-state" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Caricamento di Cucina Hub…</p>
      </section>
      <section id="errorState" class="error-state" hidden aria-live="assertive"></section>
      <div id="viewRoot" hidden></div>
    </main>
  </div>

  <dialog id="recipeDialog" class="recipe-dialog">
    <article id="recipeDialogContent"></article>
    <form method="dialog" class="dialog-actions">
      <button class="button secondary" type="submit">Chiudi</button>
    </form>
  </dialog>

  <template id="emptyTemplate">
    <div class="empty-state">
      <span aria-hidden="true">🗂️</span>
      <h2>Nessun contenuto</h2>
      <p>Questa sezione è pronta per i prossimi aggiornamenti.</p>
    </div>
  </template>

  <!-- Avvia subito la dashboard statica senza attendere librerie esterne. -->
  <script src="app.js?v=15"></script>
  <script src="appliance-detail-links.js?v=22"></script>
  <script>
    document.querySelector("#loginForm").addEventListener(
      "submit",
      event => event.preventDefault(),
      { capture: true }
    );

    if (typeof init === "function") {
      document.removeEventListener("DOMContentLoaded", init);
      void init();
    }
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>
  <script src="supabase-config.js?v=12" defer></script>
  <script src="supabase-client.js?v=12" defer></script>
  <script src="auth.js?v=12" defer></script>
</body>
</html>
