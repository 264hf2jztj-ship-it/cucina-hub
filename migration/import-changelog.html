<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import changelog — Cucina Hub</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f3ee;color:#26221d;margin:0}main{max-width:860px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:16px;padding:18px;margin:16px 0}input{width:100%;box-sizing:border-box;padding:11px;font-size:1rem}button{padding:11px 16px;margin-top:12px}pre{white-space:pre-wrap;background:#211f1c;color:#f7f2e8;padding:16px;border-radius:12px;max-height:440px;overflow:auto}.ok{color:#1b6b36}.error{color:#a62424}</style>
</head>
<body><main>
<h1>Import changelog JSON → Supabase</h1>
<p>L’importatore rileva i nomi reali delle colonne di <strong>changelog_entries</strong>.</p>
<section class="panel">
<label for="confirmation"><strong>Scrivi IMPORTA per abilitare il pulsante</strong></label>
<input id="confirmation" placeholder="IMPORTA"><button id="runButton" disabled>Importa changelog</button><p id="status"></p>
</section>
<section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script>
<script type="module">
import { importChangelogEntries } from "./import-changelog.js?v=21";
const confirmation=document.querySelector("#confirmation"),runButton=document.querySelector("#runButton"),status=document.querySelector("#status"),log=document.querySelector("#log");
confirmation.addEventListener("input",()=>{runButton.disabled=confirmation.value.trim()!=="IMPORTA"});
function formatError(e){return [e?.message&&`MESSAGGIO: ${e.message}`,e?.code&&`CODICE: ${e.code}`,e?.details&&`DETTAGLIO: ${e.details}`,e?.hint&&`SUGGERIMENTO: ${e.hint}`,e?.stack&&`STACK:\n${e.stack}`].filter(Boolean).join("\n")}
runButton.addEventListener("click",async()=>{runButton.disabled=true;confirmation.disabled=true;status.className="";status.textContent="Importazione in corso…";log.textContent="Avvio…";try{const response=await fetch("../changelog.json",{cache:"no-store"});if(!response.ok)throw new Error("Impossibile caricare changelog.json");const result=await importChangelogEntries({client:window.cucinaHubSupabase,changelogData:await response.json(),onProgress(message){log.textContent+=`\n${message}`;log.scrollTop=log.scrollHeight}});log.textContent+=`\n\nREPORT FINALE\n${JSON.stringify(result,null,2)}`;status.className="ok";status.textContent="Importazione changelog completata.";confirmation.value=""}catch(error){console.error(error);log.textContent+=`\n\nERRORE COMPLETO\n${formatError(error)}`;log.scrollTop=log.scrollHeight;status.className="error";status.textContent=error?.message||"Errore durante l’importazione."}finally{confirmation.disabled=false;runButton.disabled=true}});
</script></body></html>
