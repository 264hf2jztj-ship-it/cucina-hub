<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anteprima migrazione — Cucina Hub</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}
    main{max-width:980px;margin:auto;padding:24px}
    .panel{background:#fff;border:1px solid #ddd5ca;border-radius:16px;padding:18px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .metric{background:#faf8f4;border:1px solid #e4ddd4;border-radius:12px;padding:14px}
    .metric strong{display:block;font-size:1.6rem;margin-top:4px}
    button{border:0;border-radius:10px;padding:11px 16px;background:#365d44;color:#fff;font-weight:700}
    button:disabled{opacity:.55}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:440px;overflow:auto}
    .ok{color:#1b6b36}.warning{color:#9b5b00}.error{color:#a62424}
  </style>
</head>
<body>
<main>
  <h1>Anteprima migrazione JSON → Supabase</h1>
  <p>Questa pagina legge i JSON e costruisce il payload normalizzato. Non scrive nulla nel database.</p>

  <section class="panel">
    <button id="runButton" type="button">Genera anteprima</button>
    <p id="status" aria-live="polite"></p>
  </section>

  <section id="results" hidden>
    <div class="panel">
      <h2>Conteggi</h2>
      <div id="metrics" class="grid"></div>
    </div>
    <div class="panel">
      <h2>Controlli</h2>
      <div id="warnings"></div>
    </div>
    <div class="panel">
      <h2>Payload normalizzato</h2>
      <pre id="payload"></pre>
    </div>
  </section>
</main>

<script type="module">
  import { buildImportPreview } from "./import-preview.js";

  const runButton = document.querySelector("#runButton");
  const status = document.querySelector("#status");
  const results = document.querySelector("#results");
  const metrics = document.querySelector("#metrics");
  const warnings = document.querySelector("#warnings");
  const payload = document.querySelector("#payload");

  async function loadJson(path) {
    const response = await fetch(`../${path}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`Impossibile caricare ${path}`);
    return response.json();
  }

  runButton.addEventListener("click", async () => {
    runButton.disabled = true;
    status.className = "";
    status.textContent = "Analisi in corso…";
    results.hidden = true;

    try {
      const [recipesData, appliancesData, categoriesData] = await Promise.all([
        loadJson("ricette.json"),
        loadJson("elettrodomestici.json"),
        loadJson("categorie.json")
      ]);

      const preview = buildImportPreview({ recipesData, appliancesData, categoriesData });

      metrics.innerHTML = Object.entries(preview.counts)
        .map(([name, value]) => `<div class="metric"><span>${name}</span><strong>${value}</strong></div>`)
        .join("");

      const warningEntries = Object.entries(preview.warnings)
        .filter(([, value]) => Array.isArray(value) ? value.length : Boolean(value));

      warnings.innerHTML = warningEntries.length
        ? warningEntries.map(([name, value]) => `<p class="warning"><strong>${name}:</strong> ${JSON.stringify(value)}</p>`).join("")
        : '<p class="ok"><strong>Nessuna anomalia bloccante rilevata.</strong></p>';

      payload.textContent = JSON.stringify(preview, null, 2);
      status.className = "ok";
      status.textContent = "Anteprima generata. Supabase non è stato modificato.";
      results.hidden = false;
    } catch (error) {
      console.error(error);
      status.className = "error";
      status.textContent = error.message;
    } finally {
      runButton.disabled = false;
    }
  });
</script>
</body>
</html>
