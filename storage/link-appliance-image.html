<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collega immagine elettrodomestico — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:900px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:16px;padding:18px;margin-bottom:16px}label{display:block;font-weight:700;margin:12px 0 6px}select,input{width:100%;box-sizing:border-box;border:1px solid #bdb4a8;border-radius:10px;padding:10px}button{border:0;border-radius:10px;padding:11px 16px;background:#365d44;color:#fff;font-weight:700;margin-top:14px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:520px;overflow:auto}.ok{color:#1b6b36}.error{color:#a62424}.muted{color:#6d655c}</style></head><body><main><h1>Collega immagine elettrodomestico</h1><p>Collega un file già registrato in <strong>storage_files</strong> alla tabella <strong>appliance_images</strong>.</p><section class="panel"><p class="muted">Non carica nuovi file e non modifica lo Storage.</p><label for="appliance">Elettrodomestico</label><select id="appliance"><option value="">Caricamento…</option></select><label for="file">Immagine disponibile</label><select id="file"><option value="">Seleziona prima l’elettrodomestico</option></select><label for="confirmation">Scrivi COLLEGA</label><input id="confirmation" placeholder="COLLEGA" autocomplete="off"><button id="run" disabled>Collega come immagine principale</button><p id="status"></p></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">const client=window.cucinaHubSupabase,a=document.querySelector('#appliance'),f=document.querySelector('#file'),c=document.querySelector('#confirmation'),run=document.querySelector('#run'),status=document.querySelector('#status'),log=document.querySelector('#log');const check=(e,x)=>{if(e)throw new Error(`${x}: ${e.message}`)};const add=v=>{log.textContent+=`\n${v}`;log.scrollTop=log.scrollHeight};c.addEventListener('input',()=>run.disabled=c.value.trim()!=='COLLEGA');async function admin(){const{data,error}=await client.auth.getSession();check(error,'Sessione');const u=data.session?.user;if(!u)throw new Error('Accedi con l’account amministratore.');const{data:p,error:pe}=await client.from('profiles').select('role').eq('id',u.id).maybeSingle();check(pe,'Profilo');if(p?.role!=='admin')throw new Error('Ruolo amministratore richiesto.');return u.id}async function col(table,names,required=false){for(const n of names){const{error}=await client.from(table).select(n).limit(1);if(!error)return n;const t=(error.message||'').toLowerCase();if(!(error.code==='42703'||t.includes('column')))throw error}if(required)throw new Error(`Colonna non trovata in ${table}: ${names.join(', ')}`);return null}async function schemas(){return{sf:{id:await col('storage_files',['id'],true),owner:await col('storage_files',['owner_user_id','user_id'],true),bucket:await col('storage_files',['bucket_name','bucket_id','bucket'],true),path:await col('storage_files',['object_path','storage_path','path'],true),name:await col('storage_files',['original_filename','file_name','filename'])},ai:{id:await col('appliance_images',['id'],true),owner:await col('appliance_images',['owner_user_id','user_id']),appliance:await col('appliance_images',['appliance_id'],true),file:await col('appliance_images',['storage_file_id','file_id'],true),primary:await col('appliance_images',['is_primary','is_cover','primary']),role:await col('appliance_images',['image_role','role','kind']),sort:await col('appliance_images',['sort_order','position','display_order']),alt:await col('appliance_images',['alt_text','caption','title'])}}}let owner,schema;async function loadFiles(){f.innerHTML='<option value="">Caricamento…</option>';if(!a.value){f.innerHTML='<option value="">Seleziona prima l’elettrodomestico</option>';return}const q=client.from('storage_files').select('*').eq(schema.sf.owner,owner).eq(schema.sf.bucket,'appliance-images').ilike(schema.sf.path,`%/${a.value}/%`).order('created_at',{ascending:false});const{data,error}=await q;check(error,'Lettura storage_files');f.innerHTML='<option value="">Seleziona…</option>';for(const row of data||[]){const o=document.createElement('option');o.value=row[schema.sf.id];o.textContent=row[schema.sf.name]||row[schema.sf.path];o.dataset.path=row[schema.sf.path];f.appendChild(o)}if(!(data||[]).length)f.innerHTML='<option value="">Nessuna immagine trovata</option>'}async function init(){try{owner=await admin();schema=await schemas();const{data,error}=await client.from('appliances').select('id,name').eq('owner_user_id',owner).order('name');check(error,'Lettura appliances');a.innerHTML='<option value="">Seleziona…</option>';for(const item of data||[]){const o=document.createElement('option');o.value=item.id;o.textContent=item.name;a.appendChild(o)}a.addEventListener('change',()=>loadFiles().catch(e=>{status.className='error';status.textContent=e.message}))}catch(e){status.className='error';status.textContent=e.message}}run.addEventListener('click',async()=>{run.disabled=true;c.disabled=true;status.className='';status.textContent='Collegamento in corso…';log.textContent='Avvio…';try{owner=owner||await admin();schema=schema||await schemas();if(!a.value)throw new Error('Seleziona un elettrodomestico.');if(!f.value)throw new Error('Seleziona un’immagine.');let query=client.from('appliance_images').select('*').eq(schema.ai.appliance,a.value).eq(schema.ai.file,f.value);if(schema.ai.owner)query=query.eq(schema.ai.owner,owner);const{data:existing,error:ee}=await query.maybeSingle();check(ee,'Verifica collegamento');let record=existing,created=false;if(!record){const row={[schema.ai.appliance]:a.value,[schema.ai.file]:f.value};if(schema.ai.owner)row[schema.ai.owner]=owner;if(schema.ai.primary)row[schema.ai.primary]=true;if(schema.ai.role)row[schema.ai.role]='primary';if(schema.ai.sort)row[schema.ai.sort]=0;if(schema.ai.alt)row[schema.ai.alt]=a.selectedOptions[0]?.textContent||'Elettrodomestico';const{data,error}=await client.from('appliance_images').insert(row).select('*').single();check(error,'Inserimento appliance_images');record=data;created=true}const report={pass:true,created,existing:!created,appliance_id:a.value,appliance_name:a.selectedOptions[0]?.textContent,storage_file_id:f.value,appliance_image_id:record[schema.ai.id],object_path:f.selectedOptions[0]?.dataset.path||null,schema_mapping:schema.ai};add(`REPORT FINALE\n${JSON.stringify(report,null,2)}`);status.className='ok';status.textContent=created?'Immagine collegata.':'Collegamento già esistente.'}catch(e){add(`ERRORE COMPLETO\n${e.stack||e.message}`);status.className='error';status.textContent=e.message}finally{c.disabled=false;c.value='';run.disabled=true}});init();</script></body></html>
