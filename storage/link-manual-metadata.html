<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collega manuali — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:900px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:16px;padding:18px;margin-bottom:16px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bdb4a8;border-radius:10px}button{margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#365d44;color:#fff;font-weight:700}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:560px;overflow:auto}.ok{color:#1b6b36}.error{color:#a62424}</style></head><body><main><h1>Collega manuali caricati</h1><p>Crea o aggiorna i record <strong>manuals</strong>, li collega ai file già presenti in <strong>storage_files</strong> e crea <strong>appliance_manuals</strong>.</p><section class="panel"><label>Scrivi COLLEGA</label><input id="confirmation" placeholder="COLLEGA" autocomplete="off"><button id="run" disabled>Collega metadati e manuali</button><p id="status"></p></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">
const c=window.cucinaHubSupabase,$=s=>document.querySelector(s),log=$('#log'),status=$('#status'),run=$('#run'),confirmation=$('#confirmation');confirmation.addEventListener('input',()=>run.disabled=confirmation.value.trim()!=='COLLEGA');function add(x){log.textContent+=`\n${x}`;log.scrollTop=log.scrollHeight}function ok(e,ctx){if(e){const x=new Error(`${ctx}: ${e.message}`);x.code=e.code;x.details=e.details;throw x}}function missing(e){const t=`${e?.message||''} ${e?.details||''}`.toLowerCase();return e?.code==='42703'||(t.includes('column')&&t.includes('does not exist'))}
async function col(table,names,required=false){for(const n of names){const{error}=await c.from(table).select(n).limit(1);if(!error)return n;if(!missing(error))ok(error,`Schema ${table}.${n}`)}if(required)throw new Error(`Colonna non trovata in ${table}: ${names.join(', ')}`);return null}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\(1\)/g,'').replace(/[^a-z0-9]+/g,'')}
function allowedManualType(value){return value==='personal_guide'?'other':value}
function isPrimaryManual(entry){return entry.document_type!=='personal_guide'}
async function admin(){const{data,error}=await c.auth.getSession();ok(error,'Sessione');const u=data.session?.user;if(!u)throw new Error('Accedi prima con l’account amministratore.');const{data:p,error:pe}=await c.from('profiles').select('role').eq('id',u.id).maybeSingle();ok(pe,'Profilo');if(p?.role!=='admin')throw new Error('Ruolo amministratore richiesto.');return u.id}
run.addEventListener('click',async()=>{run.disabled=true;confirmation.disabled=true;status.textContent='Collegamento in corso…';status.className='';log.textContent='Avvio…';try{const owner=await admin();const response=await fetch('../manuali.json',{cache:'no-store'});if(!response.ok)throw new Error('Impossibile caricare manuali.json');const entries=(await response.json()).manuali||[];const s={sf:{id:await col('storage_files',['id'],true),owner:await col('storage_files',['owner_user_id','user_id'],true),bucket:await col('storage_files',['bucket_id','bucket_name','bucket'],true),path:await col('storage_files',['object_path','storage_path','path'],true),filename:await col('storage_files',['original_filename','file_name','filename'])},m:{id:await col('manuals',['id'],true),owner:await col('manuals',['owner_user_id','user_id'],true),title:await col('manuals',['title','name'],true),file:await col('manuals',['storage_file_id','file_id'],true),manufacturer:await col('manuals',['manufacturer','brand']),model:await col('manuals',['model','model_number']),language:await col('manuals',['language','language_code']),type:await col('manuals',['document_type','manual_type','type']),version:await col('manuals',['version_label','version']),filename:await col('manuals',['source_filename','file_name','filename']),notes:await col('manuals',['notes','description'])},l:{appliance:await col('appliance_manuals',['appliance_id'],true),manual:await col('appliance_manuals',['manual_id'],true),primary:await col('appliance_manuals',['is_primary','primary'],true)}};add(`Schema: ${JSON.stringify(s)}`);const{data:files,error:fe}=await c.from('storage_files').select('*').eq(s.sf.owner,owner).eq(s.sf.bucket,'manuals');ok(fe,'Lettura storage_files');const report={manuals:{created:0,updated:0},appliance_manuals:{created:0,updated:0,existing:0},matched_files:0};for(const e of entries){const candidates=(files||[]).filter(f=>{const text=norm(`${f[s.sf.filename]||''} ${f[s.sf.path]||''}`);const keys=[norm(e.source_filename),norm(e.legacy_key),norm(e.model),norm(e.title)].filter(Boolean);return keys.some(k=>k.length>5&&text.includes(k.slice(0,Math.min(k.length,18))))});let file=candidates[0];if(!file){const hints=e.legacy_key.includes('samsung')?['samsung','nv75']:e.legacy_key.includes('hurom-e30st-personal')?['hurom','personale']:e.legacy_key.includes('hurom')?['hurom','europa']:['ninja','tb401'];file=(files||[]).find(f=>hints.every(h=>norm(`${f[s.sf.filename]||''} ${f[s.sf.path]||''}`).includes(norm(h))))}if(!file)throw new Error(`File storage non trovato per: ${e.title}`);report.matched_files++;const{data:ap,error:ae}=await c.from('appliances').select('id').eq('owner_user_id',owner).eq('name',e.appliance_name).maybeSingle();ok(ae,'Lettura appliances');if(!ap)throw new Error(`Elettrodomestico non trovato: ${e.appliance_name}`);const{data:existing,error:ee}=await c.from('manuals').select('*').eq(s.m.owner,owner).eq(s.m.title,e.title).limit(1).maybeSingle();ok(ee,'Lettura manuals');const row={[s.m.owner]:owner,[s.m.title]:e.title,[s.m.file]:file[s.sf.id]};if(s.m.manufacturer)row[s.m.manufacturer]=e.manufacturer??null;if(s.m.model)row[s.m.model]=e.model??null;if(s.m.language)row[s.m.language]=e.language??null;if(s.m.type)row[s.m.type]=allowedManualType(e.document_type??null);if(s.m.version)row[s.m.version]=e.version_label??null;if(s.m.filename)row[s.m.filename]=e.source_filename??null;if(s.m.notes)row[s.m.notes]=e.notes??null;let manual;if(existing){const{data,error}=await c.from('manuals').update(row).eq(s.m.id,existing[s.m.id]).select('*').single();ok(error,'Aggiornamento manuals');manual=data;report.manuals.updated++}else{const{data,error}=await c.from('manuals').insert(row).select('*').single();ok(error,'Inserimento manuals');manual=data;report.manuals.created++}const filters={[s.l.appliance]:ap.id,[s.l.manual]:manual[s.m.id]};const primaryValue=isPrimaryManual(e);let q=c.from('appliance_manuals').select('*').limit(1);for(const[k,v]of Object.entries(filters))q=q.eq(k,v);const{data:link,error:le}=await q.maybeSingle();ok(le,'Lettura appliance_manuals');if(link){if(link[s.l.primary]!==primaryValue){const{error}=await c.from('appliance_manuals').update({[s.l.primary]:primaryValue}).eq(s.l.appliance,ap.id).eq(s.l.manual,manual[s.m.id]);ok(error,'Aggiornamento appliance_manuals');report.appliance_manuals.updated++}else report.appliance_manuals.existing++}else{const{error}=await c.from('appliance_manuals').insert({...filters,[s.l.primary]:primaryValue});ok(error,'Inserimento appliance_manuals');report.appliance_manuals.created++}add(`Collegato: ${e.title}`)}add(`\nREPORT FINALE\n${JSON.stringify({owner_user_id:owner,source_count:entries.length,report},null,2)}`);status.className='ok';status.textContent='Collegamento completato.'}catch(e){console.error(e);add(`\nERRORE COMPLETO\n${e.stack||e.message}`);status.className='error';status.textContent=e.message}finally{confirmation.disabled=false;confirmation.value='';run.disabled=true}});
</script></body></html>
