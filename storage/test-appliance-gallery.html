<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galleria elettrodomestico — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:16px;padding:18px;margin-bottom:16px}label{display:block;font-weight:700;margin:12px 0 6px}select,button{width:100%;box-sizing:border-box;border:1px solid #bdb4a8;border-radius:10px;padding:11px}button{border:0;background:#365d44;color:#fff;font-weight:700;margin-top:14px}.hero{width:100%;aspect-ratio:4/3;object-fit:contain;background:#eee7dd;border-radius:14px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:12px}.thumb{padding:0;background:#fff;border:2px solid transparent;border-radius:12px;overflow:hidden}.thumb.active{border-color:#365d44}.thumb img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.meta{color:#6d655c;font-size:.94rem}.ok{color:#1b6b36}.error{color:#a62424}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:420px;overflow:auto}dialog{border:0;border-radius:16px;padding:0;max-width:min(94vw,1100px);background:#111}dialog::backdrop{background:#000b}dialog img{display:block;max-width:94vw;max-height:90vh;object-fit:contain}.close{position:fixed;top:16px;right:16px;width:auto;background:#fff;color:#111}</style></head><body><main><h1>Galleria immagini elettrodomestico</h1><p class="meta">Lettura da <strong>appliance_images</strong> e <strong>storage_files</strong> con URL firmati temporanei.</p><section class="panel"><label for="appliance">Elettrodomestico</label><select id="appliance"><option value="">Caricamento…</option></select><button id="load">Carica galleria</button><p id="status"></p></section><section class="panel" id="gallery" hidden><h2 id="title">Galleria</h2><img id="hero" class="hero" alt=""><p id="caption" class="meta"></p><div id="thumbs" class="thumbs"></div></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><dialog id="viewer"><button class="close" id="close">Chiudi</button><img id="full" alt=""></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">const client=window.cucinaHubSupabase,$=s=>document.querySelector(s),a=$('#appliance'),load=$('#load'),status=$('#status'),gallery=$('#gallery'),hero=$('#hero'),title=$('#title'),caption=$('#caption'),thumbs=$('#thumbs'),log=$('#log'),viewer=$('#viewer'),full=$('#full');const check=(e,c)=>{if(e)throw new Error(`${c}: ${e.message}`)};const col=async(t,n,r=false)=>{for(const x of n){const{error}=await client.from(t).select(x).limit(1);if(!error)return x;const m=(error.message||'').toLowerCase();if(!(error.code==='42703'||m.includes('column')))throw error}if(r)throw new Error(`Colonna non trovata in ${t}: ${n.join(', ')}`);return null};async function admin(){const{data,error}=await client.auth.getSession();check(error,'Sessione');const u=data.session?.user;if(!u)throw new Error('Accedi con l’account amministratore.');return u.id}async function schema(){return{ai:{owner:await col('appliance_images',['owner_user_id','user_id']),appliance:await col('appliance_images',['appliance_id'],true),file:await col('appliance_images',['storage_file_id','file_id'],true),role:await col('appliance_images',['image_role','role','kind']),sort:await col('appliance_images',['sort_order','position','display_order']),alt:await col('appliance_images',['alt_text','caption','title'])},sf:{id:await col('storage_files',['id'],true),owner:await col('storage_files',['owner_user_id','user_id'],true),bucket:await col('storage_files',['bucket_name','bucket_id','bucket'],true),path:await col('storage_files',['object_path','storage_path','path'],true),name:await col('storage_files',['original_filename','file_name','filename'])}}}let owner,s;async function init(){try{owner=await admin();s=await schema();const{data,error}=await client.from('appliances').select('id,name').eq('owner_user_id',owner).order('name');check(error,'Lettura appliances');a.innerHTML='<option value="">Seleziona…</option>';for(const x of data||[]){const o=document.createElement('option');o.value=x.id;o.textContent=x.name;a.appendChild(o)}}catch(e){status.className='error';status.textContent=e.message}}function show(item){hero.src=item.url;hero.alt=item.alt;caption.textContent=`${item.role||'gallery'} · ${item.name||''}`;full.src=item.url;[...thumbs.children].forEach((b,i)=>b.classList.toggle('active',i===item.index))}load.addEventListener('click',async()=>{status.className='';status.textContent='Caricamento…';gallery.hidden=true;log.textContent='Avvio…';try{owner=owner||await admin();s=s||await schema();if(!a.value)throw new Error('Seleziona un elettrodomestico.');let q=client.from('appliance_images').select('*').eq(s.ai.appliance,a.value);if(s.ai.owner)q=q.eq(s.ai.owner,owner);const{data:links,error}=await q;check(error,'Lettura appliance_images');if(!(links||[]).length)throw new Error('Nessuna immagine collegata.');const ids=[...new Set(links.map(x=>x[s.ai.file]))];const{data:files,error:fe}=await client.from('storage_files').select('*').in(s.sf.id,ids).eq(s.sf.owner,owner);check(fe,'Lettura storage_files');const byId=new Map((files||[]).map(x=>[x[s.sf.id],x]));const items=[];for(const link of links){const file=byId.get(link[s.ai.file]);if(!file)continue;const bucket=file[s.sf.bucket],path=file[s.sf.path];const{data,error:se}=await client.storage.from(bucket).createSignedUrl(path,300);check(se,'URL firmato');items.push({role:s.ai.role?link[s.ai.role]:null,sort:s.ai.sort?link[s.ai.sort]:0,alt:s.ai.alt?link[s.ai.alt]:(a.selectedOptions[0]?.textContent||'Elettrodomestico'),name:s.sf.name?file[s.sf.name]:path,url:data.signedUrl,path})}items.sort((x,y)=>(x.role==='cover'?-1:0)-(y.role==='cover'?-1:0)||(x.sort??0)-(y.sort??0));items.forEach((x,i)=>x.index=i);if(!items.length)throw new Error('Nessun file valido trovato.');title.textContent=a.selectedOptions[0]?.textContent||'Galleria';thumbs.innerHTML='';for(const item of items){const b=document.createElement('button');b.className='thumb';b.type='button';const im=document.createElement('img');im.src=item.url;im.alt=item.alt;b.appendChild(im);b.addEventListener('click',()=>show(item));thumbs.appendChild(b)}show(items[0]);hero.onclick=()=>viewer.showModal();gallery.hidden=false;const report={pass:true,appliance_id:a.value,appliance_name:a.selectedOptions[0]?.textContent,image_count:items.length,cover_count:items.filter(x=>x.role==='cover').length,signed_url_count:items.length,expires_in_seconds:300};log.textContent=`REPORT FINALE\n${JSON.stringify(report,null,2)}`;status.className='ok';status.textContent='Galleria caricata correttamente.'}catch(e){log.textContent=`ERRORE COMPLETO\n${e.stack||e.message}`;status.className='error';status.textContent=e.message}});$('#close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});init();</script></body></html>
