<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload immagine elettrodomestico — Cucina Hub</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:900px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:16px;padding:18px;margin-bottom:16px}label{display:block;font-weight:700;margin:12px 0 6px}select,input{width:100%;box-sizing:border-box;border:1px solid #bdb4a8;border-radius:10px;padding:10px}button{border:0;border-radius:10px;padding:11px 16px;background:#365d44;color:#fff;font-weight:700;margin-top:14px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:520px;overflow:auto}.ok{color:#1b6b36}.error{color:#a62424}.muted{color:#6d655c}</style></head><body><main><h1>Upload immagine elettrodomestico</h1><p>Carica una singola immagine nel bucket privato <strong>appliance-images</strong> e registra il file in <strong>storage_files</strong>.</p><section class="panel"><p class="muted">Test reale: JPEG, PNG, WebP, HEIC o HEIF, massimo 10 MB.</p><label for="appliance">Elettrodomestico</label><select id="appliance"><option value="">Caricamento elenco…</option></select><label for="image">Immagine</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif"><label for="confirmation">Scrivi CARICA</label><input id="confirmation" placeholder="CARICA" autocomplete="off"><button id="run" disabled>Carica e registra immagine</button><p id="status"></p></section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script type="module">const client=window.cucinaHubSupabase,a=document.querySelector('#appliance'),img=document.querySelector('#image'),confirm=document.querySelector('#confirmation'),run=document.querySelector('#run'),status=document.querySelector('#status'),log=document.querySelector('#log');confirm.addEventListener('input',()=>run.disabled=confirm.value.trim()!=='CARICA');const add=v=>{log.textContent+=`\n${v}`;log.scrollTop=log.scrollHeight};const check=(e,c)=>{if(e)throw new Error(`${c}: ${e.message}`)};const slug=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const extension=f=>({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/heif':'heif'}[f.type]||(f.name.split('.').pop()||'jpg').toLowerCase());async function admin(){const{data,error}=await client.auth.getSession();check(error,'Sessione');const u=data.session?.user;if(!u)throw new Error('Accedi con l’account amministratore.');const{data:p,error:pe}=await client.from('profiles').select('role').eq('id',u.id).maybeSingle();check(pe,'Profilo');if(p?.role!=='admin')throw new Error('Ruolo amministratore richiesto.');return u.id}async function col(names,required=false){for(const n of names){const{error}=await client.from('storage_files').select(n).limit(1);if(!error)return n;const t=(error.message||'').toLowerCase();if(!(error.code==='42703'||t.includes('column')))throw error}if(required)throw new Error(`Colonna storage_files non trovata: ${names.join(', ')}`);return null}async function schema(){return{id:await col(['id'],true),owner:await col(['owner_user_id','user_id'],true),bucket:await col(['bucket_id','bucket_name','bucket'],true),path:await col(['object_path','storage_path','path'],true),filename:await col(['original_filename','file_name','filename']),mime:await col(['mime_type','content_type']),size:await col(['size_bytes','file_size','bytes'])}}async function init(){try{const owner=await admin();const{data,error}=await client.from('appliances').select('id,name').eq('owner_user_id',owner).order('name');check(error,'Lettura appliances');a.innerHTML='<option value="">Seleziona…</option>';for(const item of data||[]){const o=document.createElement('option');o.value=item.id;o.textContent=item.name;a.appendChild(o)}}catch(e){status.className='error';status.textContent=e.message}}run.addEventListener('click',async()=>{run.disabled=true;confirm.disabled=true;status.className='';status.textContent='Caricamento in corso…';log.textContent='Avvio…';try{const owner=await admin(),s=await schema(),file=img.files[0],applianceId=a.value,applianceName=a.selectedOptions[0]?.textContent;if(!applianceId)throw new Error('Seleziona un elettrodomestico.');if(!file)throw new Error('Seleziona un’immagine.');if(file.size>10485760)throw new Error('Il file supera 10 MB.');const allowed=['image/jpeg','image/png','image/webp','image/heic','image/heif'];if(file.type&&!allowed.includes(file.type))throw new Error('Formato non supportato.');const path=`${owner}/appliances/${applianceId}/gallery/${crypto.randomUUID()}-${slug(applianceName)}.${extension(file)}`;const{error:ue}=await client.storage.from('appliance-images').upload(path,file,{contentType:file.type||'application/octet-stream',cacheControl:'3600',upsert:false});check(ue,'Upload');const row={[s.owner]:owner,[s.bucket]:'appliance-images',[s.path]:path};if(s.filename)row[s.filename]=file.name;if(s.mime)row[s.mime]=file.type||null;if(s.size)row[s.size]=file.size;const{data:record,error:ie}=await client.from('storage_files').insert(row).select('*').single();if(ie){await client.storage.from('appliance-images').remove([path]);check(ie,'Registrazione storage_files')}const report={pass:true,appliance_id:applianceId,appliance_name:applianceName,storage_file_id:record[s.id],bucket:'appliance-images',object_path:path,original_filename:file.name,size_bytes:file.size,mime_type:file.type||null};add(`REPORT FINALE\n${JSON.stringify(report,null,2)}`);status.className='ok';status.textContent='Immagine caricata e registrata.'}catch(e){add(`ERRORE COMPLETO\n${e.stack||e.message}`);status.className='error';status.textContent=e.message}finally{confirm.disabled=false;confirm.value='';run.disabled=true}});init();</script></body></html>
