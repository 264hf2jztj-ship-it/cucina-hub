<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload immagine elettrodomestico — Cucina Hub</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}
main{max-width:900px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:700;margin:12px 0 6px}select,input{width:100%;box-sizing:border-box;border:1px solid #bdb4a8;border-radius:10px;padding:10px}
button{border:0;border-radius:10px;padding:11px 16px;background:#365d44;color:#fff;font-weight:700;margin-top:14px}button:disabled{opacity:.5}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211f1c;color:#f7f2e8;border-radius:12px;padding:16px;max-height:520px;overflow:auto}.ok{color:#1b6b36}.error{color:#a62424}.muted{color:#6d655c}
</style>
</head><body><main>
<h1>Upload immagine elettrodomestico</h1>
<p>Carica una singola immagine nel bucket privato <strong>appliance-images</strong> e registra il file in <strong>storage_files</strong>.</p>
<section class="panel">
<p class="muted">Test reale: il file viene caricato in Supabase Storage. Sono accettati JPEG, PNG, WebP, HEIC e HEIF fino a 10 MB.</p>
<label for="appliance">Elettrodomestico</label><select id="appliance"><option value="">Caricamento elenco…</option></select>
<label for="image">Immagine</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif">
<label for="confirmation">Scrivi CARICA</label><input id="confirmation" placeholder="CARICA" autocomplete="off">
<button id="run" disabled>Carica e registra immagine</button><p id="status"></p>
</section><section class="panel"><h2>Registro</h2><pre id="log">In attesa.</pre></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script>
<script type="module">
const client=window.cucinaHubSupabase;
const appliance=document.querySelector('#appliance'),image=document.querySelector('#image'),confirmation=document.querySelector('#confirmation'),run=document.querySelector('#run'),status=document.querySelector('#status'),log=document.querySelector('#log');
confirmation.addEventListener('input',()=>run.disabled=confirmation.value.trim()!=='CARICA');
function add(v){log.textContent+=`\n${v}`;log.scrollTop=log.scrollHeight}function check(e,c){if(e)throw new Error(`${c}: ${e.message}`)}
function slug(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function ext(file){const byName=(file.name.split('.').pop()||'').toLowerCase();const map={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/heif':'heif'};return map[file.type]||byName||'jpg'}
async function requireAdmin(){const{data,error}=await client.auth.getSession();check(error,'Sessione');const user=data.session?.user;if(!user)throw new Error('Accedi con l’account amministratore.');const{data:p,error:pe}=await client.from('profiles').select('role').eq('id',user.id).maybeSingle();check(pe,'Profilo');if(p?.role!=='admin')throw new Error('Ruolo amministratore richiesto.');return user.id}
async function col(table,names,required=false){for(const n of names){const{error}=await client.from(table).select(n).limit(1);if(!error)return n;const t=(error.message||'').toLowerCase();if(!(error.code==='42703'||t.includes('column')))throw error}if(required)throw new Error(`Colonna non trovata in ${table}: ${names.join(', ')}`);return null}
async function schema(){return{id:await col('storage_files',['id'],true),owner:await col('storage_files',['owner_user_id','user_id'],true),bucket:await col('storage_files',['bucket_id','bucket_name','bucket'],true),path:await col('storage_files',['object_path','storage_path','path'],true),filename:await col('storage_files',['original_filename','file_name','filename']),mime:await col('storage_files',['mime_type','content_type']),size:await col('storage_files',['size_bytes','file_size','bytes'])}}
async function init(){try{const owner=await requireAdmin();const{data,error}=await client.from('appliances').select('id,name').eq('owner_user_id',owner).order('name');check(error,'Lettura appliances');appliance.innerHTML='<option value="">Seleziona…</option>';for(const item of data||[]){const o=document.createElement('option');o.value=item.id;o.textContent=item.name;appliance.appendChild(o)}}catch(e){status.className='error';status.textContent=e.message}}
run.addEventListener('click',async()=>{run.disabled=true;confirmation.disabled=true;status.textContent='Caricamento in corso…';status.className='';log.textContent='Avvio…';try{const owner=await requireAdmin(),s=await schema(),file=image.files[0],applianceId=appliance.value,applianceName=appliance.selectedOptions[0]?.textContent;if(!applianceId)throw new Error('Seleziona un elettrodomestico.');if(!file)throw new Error('Seleziona un’immagine.');if(file.size>10*1024*1024)throw new Error('Il file supera il limite di 10 MB.');const allowed=['image/jpeg','image/png','image/webp','image/heic','image/heif'];if(file.type&&!allowed.includes(file.type))throw new Error('Formato immagine non supportato.');const objectPath=`${owner}/appliances/${applianceId}/gallery/${crypto.randomUUID()}-${slug(applianceName)}.${ext(file)}`;add(`Upload: ${file.name}`);const{error:uploadError}=await client.storage.from('appliance-images').upload(objectPath,file,{contentType:file.type||'application/octet-stream',cacheControl:'3600',upsert:false});check(uploadError,'Upload');const row={[s.owner]:owner,[s.bucket]:'appliance-images',[s.path]:objectPath};if(s.filename)row[s.filename]=file.name;if(s.mime)row[s.mime]=file.type||null;if(s.size)row[s.size]=file.size;const{data:record,error:insertError}=await client.from('storage_files').insert(row).select('*').single();if(insertError){await client.storage.from('appliance-images').remove([objectPath]);check(insertError,'Registrazione storage_files')}const report={pass:true,appliance_id:applianceId,appliance_name:applianceName,storage_file_id:record[s.id],bucket:'appliance-images',object_path:objectPath,original_filename:file.name,size_bytes:file.size,mime_type:file.type||null};add(`\nREPORT FINALE\n${JSON.stringify(report,null,2)}`);status.className='ok';status.textContent='Immagine caricata e registrata.'}catch(e){console.error(e);add(`\nERRORE COMPLETO\n${e.stack||e.message}`);status.className='error';status.textContent=e.message}finally{confirmation.disabled=false;confirmation.value='';run.disabled=true}});
init();
</script></body></html>
