<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test contratto risposta AI — Cucina Hub</title>
<style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#26221d}main{max-width:820px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:20px}button{border:0;border-radius:11px;padding:12px 16px;background:#365d44;color:#fff;font-weight:800}.ok{color:#176b35}.error{color:#a62424}pre{white-space:pre-wrap;background:#faf8f4;padding:14px;border-radius:12px}</style>
</head>
<body><main><section class="panel"><h1>Test contratto risposta AI</h1><p>Verifica schema, anteprima, conferma obbligatoria, bilancio ingredienti, coerenza con la richiesta, fonti e rifiuto delle risposte pericolose.</p><button id="run">ESEGUI TEST</button><p id="status">In attesa.</p><pre id="output"></pre></section></main>
<script src="./fermentation-assistant-response-engine.js?v=1"></script>
<script>
const request={schema:'cucina-hub.fermentation-assistant.request',version:1,goal:{product_style:'roman_pan'},format:{shape:'tray',portion_count:1,tray_width_cm:30,tray_length_cm:40},constraints:{oven_type:'samsung_oven',hydration_preference:80},personal_context:{environment:{room_temperature_c:24,fridge_temperature_c:4},available_flours:[{label:'Farina test'}]},sources:[{id:'laboratory.environment'},{id:'laboratory.flours'},{id:'laboratory.learning'},{id:'library.sources'}]};
document.querySelector('#run').onclick=()=>{try{const engine=window.CucinaHubFermentationAssistantResponseEngine;const valid=engine.buildTechnicalExample(request);const validResult=engine.validate(valid,request);if(!validResult.valid)throw new Error('Esempio valido rifiutato: '+validResult.errors.map(item=>item.message).join(' '));if(validResult.metrics.hydration_percent!==80)throw new Error('Idratazione verificata errata.');const dangerous=JSON.parse(JSON.stringify(valid));dangerous.automatic_writes=true;dangerous.requires_user_confirmation=false;dangerous.proposal.product_style='bread';dangerous.proposal.ingredients.find(item=>item.role==='water').grams=2000;dangerous.source_usage.push({source_id:'external.unknown',usage:'Fonte inventata'});const dangerousResult=engine.validate(dangerous,request);if(dangerousResult.valid)throw new Error('Risposta pericolosa accettata.');const codes=dangerousResult.errors.map(item=>item.code);['automatic_writes','confirmation','product_style_mismatch','hydration_range','source_unknown'].forEach(code=>{if(!codes.includes(code))throw new Error('Controllo mancante: '+code)});document.querySelector('#status').className='ok';document.querySelector('#status').textContent='Test completato: contratto, bilanci, coerenza, fonti, anteprima e conferma obbligatoria funzionano.';document.querySelector('#output').textContent=JSON.stringify({valid_metrics:validResult.metrics,rejected_error_codes:codes},null,2)}catch(error){document.querySelector('#status').className='error';document.querySelector('#status').textContent=error.message}};
</script></body></html>
