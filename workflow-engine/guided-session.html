<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessione guidata — Cucina Hub</title><style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#26221d}main{max-width:780px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd5ca;border-radius:22px;padding:22px;box-shadow:0 8px 28px #0000000a}.top,.modebar{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#6d655c}.activity{border-radius:14px;padding:14px;margin:12px 0;background:#faf8f4;border-left:5px solid #365d44}.timer{border-color:#d09424}.check{border-color:#3479a5}.information{border-color:#8058a5}.warning{border-color:#a84432;background:#fff3ef}.photo{border-color:#8058a5}.activity button{margin-top:10px}.done{opacity:.55}.done .activity-title{text-decoration:line-through}.why,.success,.purpose{margin-top:9px;padding:9px 11px;border-radius:10px;font-size:.95rem}.why{background:#f1edf6}.success{background:#edf5f8}.purpose{background:#eef5f0;border:1px solid #cbdccd}.activity-title{font-weight:800}.step-label{display:inline-block;min-width:2rem;color:#6d655c}.modebar{margin:12px 0 6px}.segmented{display:flex;background:#eee8df;border-radius:11px;padding:3px}.segmented button{background:transparent;color:#26221d;padding:8px 12px}.segmented button.active{background:#365d44;color:#fff}button,a.button{padding:13px 17px;border:0;border-radius:11px;background:#365d44;color:white;font-weight:800;text-decoration:none}.secondary{background:#eee8df;color:#26221d}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.progress{height:8px;background:#e7e1d8;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:#365d44}.big{font-size:1.65rem;margin:.3em 0}.sequence-note{background:#fff8df;border:1px solid #e4cf7d;border-radius:12px;padding:10px 12px;margin:12px 0}.expert .why,.expert .purpose{display:none}.expert .activity{padding:11px 13px;margin:8px 0}.expert .information{display:none}.session-title{font-size:.9rem;color:#6d655c;margin-bottom:8px}.complete-box{background:#eef5f0;border:1px solid #cbdccd;border-radius:14px;padding:16px}@media(max-width:600px){.modebar{align-items:flex-start;flex-direction:column}.nav button{flex:1}}</style></head><body><main><div class="card" id="card"><div id="sessionTitle" class="session-title"></div><div class="top"><span id="phaseNo"></span><span id="duration" class="muted"></span></div><div class="progress"><span id="bar"></span></div><div class="modebar"><div><strong>Modalità di guida</strong><div class="muted">Principiante spiega anche perché e come verificare.</div></div><div class="segmented"><button id="beginner" class="active">PRINCIPIANTE</button><button id="expert">ESPERTO</button></div></div><h1 id="title" class="big">Caricamento…</h1><p id="description" class="muted"></p><div id="purpose" class="purpose"></div><div class="sequence-note">Segui l’ordine dall’alto verso il basso. Ogni timer parte dopo il passaggio precedente.</div><div id="activities"></div><div class="nav"><button id="back" class="secondary">← INDIETRO</button><button id="next">FATTO, CONTINUA →</button></div><p id="status" class="muted"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js?v=12"></script><script src="../supabase-client.js?v=12"></script><script src="./workflow-engine.js?v=6"></script><script>
let engine,session,runtime,index=0,timers={},mode='beginner',dbSessionId=null,saveTimer=null;const $=s=>document.querySelector(s);const c=window.cucinaHubSupabase;const icons={action:'☐',timer:'▶',check:'✓',information:'ℹ',warning:'⚠',photo:'📷'};
async function init(){try{engine=new CucinaHubWorkflowEngine();dbSessionId=new URLSearchParams(location.search).get('session');if(dbSessionId){const auth=await c.auth.getSession();if(auth.error)throw auth.error;if(!auth.data.session?.user)throw new Error('Accedi prima di continuare.');const result=await c.from('baking_sessions').select('id,title,status,workflow_definition,workflow_runtime,guidance_mode').eq('id',dbSessionId).single();if(result.error)throw result.error;if(!result.data.workflow_definition)throw new Error('Questa sessione non contiene ancora un workflow guidato.');session=result.data.workflow_definition;session.phases=(session.phases||[]).map(p=>engine.normalizePhase(p));runtime=result.data.workflow_runtime||engine.createRuntime(session);index=Math.min(runtime.current_phase_index||0,session.phases.length-1);mode=result.data.guidance_mode||'beginner';$('#sessionTitle').textContent=result.data.title;await c.from('baking_sessions').update({status:'active',started_at:result.data.status==='planned'?new Date().toISOString():undefined}).eq('id',dbSessionId)}else{const response=await fetch('./phases/panificazione-core-v4.json?v=5');const phases=await response.json();engine.registerPhases(phases);session=engine.composeSession({id:'guided_demo',title:'Pizza in teglia — demo',phases:['prepare_ingredients_v1','mixing_dcg_v1','bulk_fermentation_v1','bake_samsung_v1']});runtime=engine.createRuntime(session);$('#sessionTitle').textContent='Modalità demo'}setMode(mode,false);render()}catch(e){$('#title').textContent='Errore';$('#status').textContent=e.message}}
function key(p,a){return `${p.id}:${a.id}`}
function setMode(next,persist=true){mode=next;$('#card').classList.toggle('expert',mode==='expert');$('#beginner').classList.toggle('active',mode==='beginner');$('#expert').classList.toggle('active',mode==='expert');if(persist)scheduleSave();render()}
function render(){try{const p=session.phases[index];const activities=Array.isArray(p.activities)?p.activities:[];runtime.current_phase_index=index;$('#phaseNo').textContent=`FASE ${index+1} DI ${session.phases.length}`;$('#duration').textContent=`circa ${p.estimated_minutes} min`;$('#bar').style.width=`${(index+1)/session.phases.length*100}%`;$('#title').textContent=p.title;$('#description').textContent=p.description||'';const purpose=p.why||p.purpose||p.goal;$('#purpose').innerHTML=purpose?`<strong>Perché lo facciamo</strong><br>${purpose}`:'';$('#purpose').style.display=purpose?'block':'none';$('#activities').innerHTML=activities.map((a,i)=>{const state=runtime.activities[key(p,a)]||{status:'pending'};const done=state.status==='completed';const why=(a.why_now||a.why)&&mode==='beginner'?`<div class="why"><strong>Perché adesso</strong><br>${a.why_now||a.why}</div>`:'';const success=a.success_criteria||a.success;const successBox=success?`<div class="success"><strong>Come capisci che puoi continuare</strong><br>${success}</div>`:'';const control=a.kind==='timer'?`<div><button onclick="startTimer('${a.id}',${a.seconds})">${done?'TIMER COMPLETATO':'AVVIA '+Math.ceil(a.seconds/60)+' MIN'}</button> <span id="t-${a.id}"></span></div>`:`<button onclick="complete('${a.id}')">${done?'COMPLETATA':'SEGNA FATTO'}</button>`;return `<div class="activity ${a.kind} ${done?'done':''}" id="a-${a.id}"><div class="activity-title"><span class="step-label">${i+1}.</span>${icons[a.kind]||'•'} ${a.label}</div>${why}${successBox}${control}</div>`}).join('');$('#back').disabled=index===0;$('#next').textContent=index===session.phases.length-1?'TERMINA SESSIONE':'FATTO, CONTINUA →';$('#status').textContent=dbSessionId?'Avanzamento salvato automaticamente.':'Modalità demo: avanzamento non sincronizzato.'}catch(e){$('#title').textContent='Errore';$('#status').textContent=e.message}}
function complete(id){engine.completeActivity(runtime,session.phases[index].id,id);scheduleSave();render()}
function startTimer(id,seconds){const activityKey=key(session.phases[index],{id});if(runtime.activities[activityKey]?.status==='completed')return;clearInterval(timers[id]);runtime.activities[activityKey].status='active';runtime.activities[activityKey].started_at=new Date().toISOString();let left=runtime.activities[activityKey].remaining_seconds||seconds;const out=()=>{const node=$(`#t-${id}`);if(node)node.textContent=` ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};out();timers[id]=setInterval(()=>{left--;runtime.activities[activityKey].remaining_seconds=left;out();if(left%10===0)scheduleSave();if(left<=0){clearInterval(timers[id]);complete(id);alert('Timer completato')}},1000);scheduleSave()}
function scheduleSave(){if(!dbSessionId)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveProgress,400)}
async function saveProgress(){runtime.current_phase_index=index;const{error}=await c.from('baking_sessions').update({workflow_runtime:runtime,guidance_mode:mode,updated_at:new Date().toISOString()}).eq('id',dbSessionId);if(error)$('#status').textContent='Errore salvataggio: '+error.message}
async function finish(){runtime.status='completed';runtime.completed_at=new Date().toISOString();if(dbSessionId){const{error}=await c.from('baking_sessions').update({status:'completed',workflow_runtime:runtime,guidance_mode:mode,completed_at:runtime.completed_at,updated_at:runtime.completed_at}).eq('id',dbSessionId);if(error)throw error}$('#title').textContent='Sessione completata';$('#description').innerHTML='<div class="complete-box">Il workflow è terminato e il risultato è pronto per il Laboratorio.</div>';$('#purpose').style.display='none';$('#activities').innerHTML='';$('.nav').innerHTML='<a class="button" href="../fermentation/baking-wizard.html">NUOVA SESSIONE</a>';$('#bar').style.width='100%';$('#status').textContent=dbSessionId?'Sessione salvata come completata.':'Demo completata.'}
$('#beginner').onclick=()=>setMode('beginner');$('#expert').onclick=()=>setMode('expert');$('#back').onclick=()=>{if(index>0){index--;scheduleSave();render()}};$('#next').onclick=async()=>{try{if(index<session.phases.length-1){index++;scheduleSave();render();scrollTo({top:0,behavior:'smooth'})}else await finish()}catch(e){$('#status').textContent=e.message}};window.complete=complete;window.startTimer=startTimer;init();
</script></body></html>
