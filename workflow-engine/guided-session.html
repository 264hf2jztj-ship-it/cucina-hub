<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessione guidata — Cucina Hub</title><style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#26221d}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd5ca;border-radius:22px;padding:22px;box-shadow:0 8px 28px #0000000a}.top{display:flex;justify-content:space-between;gap:12px}.muted{color:#6d655c}.activity{border-radius:14px;padding:14px;margin:10px 0;background:#faf8f4;border-left:5px solid #365d44}.timer{border-color:#d09424}.check{border-color:#3479a5}.information{border-color:#8058a5}.warning{border-color:#a84432;background:#fff3ef}.activity button{margin-top:10px}.done{opacity:.55;text-decoration:line-through}button{padding:13px 17px;border:0;border-radius:11px;background:#365d44;color:white;font-weight:800}.secondary{background:#eee8df;color:#26221d}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.progress{height:8px;background:#e7e1d8;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:#365d44}.big{font-size:1.65rem;margin:.3em 0}</style></head><body><main><div class="card"><div class="top"><span id="phaseNo"></span><span id="duration" class="muted"></span></div><div class="progress"><span id="bar"></span></div><h1 id="title" class="big">Caricamento…</h1><p id="description" class="muted"></p><div id="activities"></div><div class="nav"><button id="back" class="secondary">← INDIETRO</button><button id="next">FATTO, CONTINUA →</button></div><p id="status" class="muted"></p></div></main><script src="./workflow-engine.js"></script><script>
let engine,session,runtime,index=0,timers={};const $=s=>document.querySelector(s);const icons={action:'☐',timer:'▶',check:'✓',information:'ℹ',warning:'⚠',photo:'📷'};
async function init(){try{const phases=await(await fetch('./phases/panificazione-core.json?v=2')).json();engine=new CucinaHubWorkflowEngine();engine.registerPhases(phases);session=engine.composeSession({id:'guided_demo',title:'Pizza in teglia — sessione guidata',phases:['prepare_ingredients_v1','mixing_dcg_v1','bulk_fermentation_v1','bake_samsung_v1']});runtime=engine.createRuntime(session);render()}catch(e){$('#title').textContent='Errore';$('#status').textContent=e.message}}
function key(p,a){return `${p.id}:${a.id}`}function render(){const p=session.phases[index];$('#phaseNo').textContent=`FASE ${index+1} DI ${session.phases.length}`;$('#duration').textContent=`circa ${p.estimated_minutes} min`;$('#bar').style.width=`${(index+1)/session.phases.length*100}%`;$('#title').textContent=p.title;$('#description').textContent=p.description||'';$('#activities').innerHTML=p.activities.map(a=>{const done=runtime.activities[key(p,a)].status==='completed';return `<div class="activity ${a.kind} ${done?'done':''}" id="a-${a.id}"><strong>${icons[a.kind]} ${a.label}</strong>${a.kind==='timer'?`<div><button onclick="startTimer('${a.id}',${a.seconds})">AVVIA ${Math.ceil(a.seconds/60)} MIN</button> <span id="t-${a.id}"></span></div>`:`<button onclick="complete('${a.id}')">${done?'COMPLETATA':'SEGNA FATTO'}</button>`}</div>`}).join('');$('#back').disabled=index===0;$('#next').textContent=index===session.phases.length-1?'TERMINA SESSIONE':'FATTO, CONTINUA →';$('#status').textContent='';}
function complete(id){engine.completeActivity(runtime,session.phases[index].id,id);render()}function startTimer(id,seconds){clearInterval(timers[id]);let left=seconds;const out=()=>{$(`#t-${id}`).textContent=` ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};out();timers[id]=setInterval(()=>{left--;out();if(left<=0){clearInterval(timers[id]);complete(id);alert('Timer completato')}} ,1000)}
$('#back').onclick=()=>{if(index>0){index--;render()}};$('#next').onclick=()=>{if(index<session.phases.length-1){index++;render()}else{$('#title').textContent='Sessione completata';$('#description').textContent='Il workflow è terminato. Il prossimo step collegherà valutazione e Laboratorio.';$('#activities').innerHTML='';$('.nav').style.display='none';$('#bar').style.width='100%'}};window.complete=complete;window.startTimer=startTimer;init();
</script></body></html>
