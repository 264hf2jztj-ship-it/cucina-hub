<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessione guidata — Cucina Hub</title><style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#26221d}main{max-width:780px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd5ca;border-radius:22px;padding:22px;box-shadow:0 8px 28px #0000000a}.top,.modebar{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#6d655c}.activity{border-radius:14px;padding:14px;margin:12px 0;background:#faf8f4;border-left:5px solid #365d44}.timer{border-color:#d09424}.check{border-color:#3479a5}.information{border-color:#8058a5}.warning{border-color:#a84432;background:#fff3ef}.activity button{margin-top:10px}.done{opacity:.55}.done .activity-title{text-decoration:line-through}.why,.success,.purpose{margin-top:9px;padding:9px 11px;border-radius:10px;font-size:.95rem}.why{background:#f1edf6}.success{background:#edf5f8}.purpose{background:#eef5f0;border:1px solid #cbdccd}.activity-title{font-weight:800}.step-label{display:inline-block;min-width:2rem;color:#6d655c}.modebar{margin:12px 0 6px}.segmented{display:flex;background:#eee8df;border-radius:11px;padding:3px}.segmented button{background:transparent;color:#26221d;padding:8px 12px}.segmented button.active{background:#365d44;color:#fff}button{padding:13px 17px;border:0;border-radius:11px;background:#365d44;color:white;font-weight:800}.secondary{background:#eee8df;color:#26221d}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.progress{height:8px;background:#e7e1d8;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:#365d44}.big{font-size:1.65rem;margin:.3em 0}.sequence-note{background:#fff8df;border:1px solid #e4cf7d;border-radius:12px;padding:10px 12px;margin:12px 0}.expert .why,.expert .purpose,.expert .description-detail{display:none}.expert .activity{padding:11px 13px;margin:8px 0}.expert .information{display:none}@media(max-width:600px){.modebar{align-items:flex-start;flex-direction:column}.nav button{flex:1}}</style></head><body><main><div class="card" id="card"><div class="top"><span id="phaseNo"></span><span id="duration" class="muted"></span></div><div class="progress"><span id="bar"></span></div><div class="modebar"><div><strong>Modalità di guida</strong><div class="muted">Principiante spiega anche perché e come verificare.</div></div><div class="segmented"><button id="beginner" class="active">PRINCIPIANTE</button><button id="expert">ESPERTO</button></div></div><h1 id="title" class="big">Caricamento…</h1><p id="description" class="muted"></p><div id="purpose" class="purpose"></div><div class="sequence-note">Segui l’ordine dall’alto verso il basso. Ogni timer parte solo dopo aver completato il passaggio precedente.</div><div id="activities"></div><div class="nav"><button id="back" class="secondary">← INDIETRO</button><button id="next">FATTO, CONTINUA →</button></div><p id="status" class="muted"></p></div></main><script src="./workflow-engine.js?v=5"></script><script>
let engine,session,runtime,index=0,timers={},mode='beginner';const $=s=>document.querySelector(s);const icons={action:'☐',timer:'▶',check:'✓',information:'ℹ',warning:'⚠',photo:'📷'};
async function init(){try{const response=await fetch('./phases/panificazione-core-v4.json?v=5');if(!response.ok)throw new Error('Impossibile caricare la libreria delle fasi.');const phases=await response.json();engine=new CucinaHubWorkflowEngine();engine.registerPhases(phases);session=engine.composeSession({id:'guided_demo',title:'Pizza in teglia — sessione guidata',phases:['prepare_ingredients_v1','mixing_dcg_v1','bulk_fermentation_v1','bake_samsung_v1']});session.phases=session.phases.map(p=>engine.normalizePhase?engine.normalizePhase(p):p);runtime=engine.createRuntime(session);render()}catch(e){$('#title').textContent='Errore';$('#status').textContent=e.message}}
function key(p,a){return `${p.id}:${a.id}`}
function setMode(next){mode=next;$('#card').classList.toggle('expert',mode==='expert');$('#beginner').classList.toggle('active',mode==='beginner');$('#expert').classList.toggle('active',mode==='expert');render()}
function render(){try{const p=session.phases[index];const activities=Array.isArray(p.activities)?p.activities:[];$('#phaseNo').textContent=`FASE ${index+1} DI ${session.phases.length}`;$('#duration').textContent=`circa ${p.estimated_minutes} min`;$('#bar').style.width=`${(index+1)/session.phases.length*100}%`;$('#title').textContent=p.title;$('#description').textContent=p.description||'';$('#purpose').innerHTML=p.purpose?`<strong>Perché lo facciamo</strong><br>${p.purpose}`:'';$('#purpose').style.display=p.purpose?'block':'none';$('#activities').innerHTML=activities.map((a,i)=>{const state=runtime.activities[key(p,a)]||{status:'pending'};const done=state.status==='completed';const why=a.why&&mode==='beginner'?`<div class="why"><strong>Perché adesso</strong><br>${a.why}</div>`:'';const success=a.success?`<div class="success"><strong>Come capisci che puoi continuare</strong><br>${a.success}</div>`:'';const control=a.kind==='timer'?`<div><button onclick="startTimer('${a.id}',${a.seconds})">AVVIA ${Math.ceil(a.seconds/60)} MIN</button> <span id="t-${a.id}"></span></div>`:`<button onclick="complete('${a.id}')">${done?'COMPLETATA':'SEGNA FATTO'}</button>`;return `<div class="activity ${a.kind} ${done?'done':''}" id="a-${a.id}"><div class="activity-title"><span class="step-label">${i+1}.</span>${icons[a.kind]||'•'} ${a.label}</div>${why}${success}${control}</div>`}).join('');if(!activities.length)$('#activities').innerHTML='<p class="muted">Nessuna attività disponibile per questa fase.</p>';$('#back').disabled=index===0;$('#next').textContent=index===session.phases.length-1?'TERMINA SESSIONE':'FATTO, CONTINUA →';$('#status').textContent=''}catch(e){$('#title').textContent='Errore';$('#status').textContent=e.message}}
function complete(id){engine.completeActivity(runtime,session.phases[index].id,id);render()}
function startTimer(id,seconds){clearInterval(timers[id]);let left=seconds;const out=()=>{const node=$(`#t-${id}`);if(node)node.textContent=` ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};out();timers[id]=setInterval(()=>{left--;out();if(left<=0){clearInterval(timers[id]);complete(id);alert('Timer completato')}} ,1000)}
$('#beginner').onclick=()=>setMode('beginner');$('#expert').onclick=()=>setMode('expert');$('#back').onclick=()=>{if(index>0){index--;render()}};$('#next').onclick=()=>{if(index<session.phases.length-1){index++;render()}else{$('#title').textContent='Sessione completata';$('#description').textContent='Il workflow è terminato. Il prossimo step collegherà valutazione e Laboratorio.';$('#purpose').style.display='none';$('#activities').innerHTML='';$('.nav').style.display='none';$('#bar').style.width='100%';$('#status').textContent=''}};window.complete=complete;window.startTimer=startTimer;init();
</script></body></html>
