<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test correzione umidità — Cucina Hub</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ee;color:#26221d}main{max-width:820px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px}button{padding:12px 16px;border:0;border-radius:11px;background:#365d44;color:#fff;font-weight:800}.case{margin-top:12px;padding:12px;border:1px solid #e4ddd3;border-radius:12px}.ok{color:#176b35}.error{color:#a62424}pre{white-space:pre-wrap;background:#faf8f4;padding:12px;border-radius:10px}
  </style>
</head>
<body>
<main>
  <h1>Test correzione umidità</h1>
  <section class="panel">
    <p>Verifica ambiente molto secco, equilibrato e molto umido. Il motore non deve modificare automaticamente acqua, lievito o tempi.</p>
    <button id="run">ESEGUI TEST</button>
    <div id="result"></div>
  </section>
</main>
<script src="./humidity-correction-engine.js?v=1"></script>
<script>
const result=document.querySelector('#result');
function assert(condition,message){if(!condition)throw new Error(message)}
function run(){
  try{
    const dry=CucinaHubHumidityCorrectionEngine.calculate({relativeHumidityPercent:30});
    const balanced=CucinaHubHumidityCorrectionEngine.calculate({relativeHumidityPercent:55});
    const humid=CucinaHubHumidityCorrectionEngine.calculate({relativeHumidityPercent:85});
    [dry,balanced,humid].forEach(item=>{
      const validation=CucinaHubHumidityCorrectionEngine.validate(item);
      assert(validation.valid,validation.errors.join(' '));
      Object.values(item.quantitative_adjustments).forEach(value=>assert(value===0,'Una correzione quantitativa non prevista è diversa da zero.'));
    });
    assert(dry.classification==='very_dry','Classificazione ambiente secco errata.');
    assert(balanced.classification==='balanced','Classificazione ambiente equilibrato errata.');
    assert(humid.classification==='very_humid','Classificazione ambiente umido errata.');
    assert(dry.operational.monitor_mid_phase===true,'Manca il controllo intermedio nel caso molto secco.');
    assert(humid.operational.monitor_mid_phase===true,'Manca il controllo intermedio nel caso molto umido.');
    result.innerHTML=`<p class="ok"><strong>Test completato: ambiente secco, equilibrato e umido funzionano senza alterare formula o timeline.</strong></p>${[dry,balanced,humid].map(item=>`<div class="case"><strong>${item.relative_humidity_percent}% — ${item.classification_label}</strong><p>${item.explanation}</p><pre>${item.operational.covering_strategy}\n${item.operational.handling_strategy}</pre></div>`).join('')}`;
  }catch(error){result.innerHTML=`<p class="error"><strong>Test fallito:</strong> ${error.message}</p>`}
}
document.querySelector('#run').onclick=run;
</script>
</body>
</html>
