<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow Engine Test — Cucina Hub</title>
<style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#26221d}main{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:18px}button{padding:12px 16px;border:0;border-radius:10px;background:#365d44;color:#fff;font-weight:800}.ok{color:#176b35}.error{color:#a62424}.phase{border-left:4px solid #365d44;background:#faf8f4;padding:12px;margin:10px 0;border-radius:8px}.muted{color:#6d655c}code{background:#eee8df;padding:2px 5px;border-radius:5px}</style></head>
<body><main><h1>Workflow Engine Core</h1><p class="muted">Pagina tecnica di verifica del motore, senza Supabase.</p><section class="panel"><button id="run">ESEGUI TEST</button><p id="status">In attesa.</p></section><section class="panel"><h2>Sessione composta</h2><div id="output"></div></section></main>
<script src="./workflow-engine.js"></script><script>
const status=document.querySelector('#status'),output=document.querySelector('#output');
async function run(){try{status.className='';status.textContent='Caricamento fasi…';const response=await fetch('./phases/panificazione-core.json?v=1');if(!response.ok)throw new Error('Impossibile caricare la libreria fasi.');const phases=await response.json();const engine=new CucinaHubWorkflowEngine();engine.registerPhases(phases);const session=engine.composeSession({id:'pizza_teglia_demo',title:'Pizza in teglia — demo engine',version:1,status:'planned',context:{flour_g:1000,appliance:'Samsung NV75N5641RS/ET'},phases:['prepare_ingredients_v1','mixing_dcg_v1','bulk_fermentation_v1','bake_samsung_v1']});const timeline=engine.buildTimeline(session,new Date());const runtime=engine.createRuntime(session);output.innerHTML=`<p><strong>${session.title}</strong><br>${session.phases.length} fasi · ${session.estimated_minutes} minuti stimati</p>`+timeline.map(p=>`<article class="phase"><strong>${p.order}. ${p.title}</strong><br><span class="muted">${new Date(p.starts_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}–${new Date(p.ends_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})} · ${p.type}</span><p>${p.instructions.join(' ')}</p><small>${p.checklist?.length||0} checklist · ${p.timers?.length||0} timer · ${p.quality_checks?.length||0} controlli qualità</small></article>`).join('')+`<p>Runtime iniziale: <code>${runtime.status}</code>, fase indice <code>${runtime.current_phase_index}</code></p>`;status.className='ok';status.textContent='Test completato: registrazione, composizione, timeline e runtime funzionano.'}catch(error){status.className='error';status.textContent=error.message;output.innerHTML='';}}
document.querySelector('#run').onclick=run;
</script></body></html>
