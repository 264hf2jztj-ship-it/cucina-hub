<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Timeline intelligente — Cucina Hub</title><style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#26221d}main{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px}.ok{color:#176b35}.error{color:#a62424}.events{display:grid;gap:9px;margin-top:16px}.event{padding:10px 12px;border-left:4px solid #365d44;background:#faf8f4;border-radius:8px}.event.parallel{border-color:#8058a5;background:#f4f0f8}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:14px 0}.metric{padding:10px;border:1px solid #ddd5ca;border-radius:10px}.metric strong{display:block;font-size:1.15rem}button{padding:12px 15px;border:0;border-radius:10px;background:#365d44;color:#fff;font-weight:800}@media(max-width:600px){main{padding:16px}}</style></head><body><main><h1>Test Timeline intelligente</h1><p>Verifica il calcolo a ritroso, l’ancoraggio al pasto e il preriscaldamento in parallelo.</p><section class="card"><button id="run">ESEGUI TEST</button><p id="status">In attesa.</p><div id="summary" class="summary"></div><div id="events" class="events"></div></section></main><script src="./timeline-engine.js?v=1"></script><script>
const $=s=>document.querySelector(s);function time(value){return new Date(value).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}function run(){try{const target=new Date();target.setDate(target.getDate()+1);target.setHours(20,0,0,0);const workflow={id:'timeline_smoke_test',phases:[{id:'session_preparation',type:'preparation',title:'Preparazione',estimated_minutes:10,activities:[]},{id:'session_mixing',type:'mixing',title:'Impasto',estimated_minutes:18,activities:[]},{id:'session_bulk',type:'fermentation',title:'Puntata',estimated_minutes:120,activities:[]},{id:'session_proof',type:'fermentation',title:'Appretto',estimated_minutes:180,activities:[]},{id:'session_bake',type:'baking',title:'Forno Samsung',estimated_minutes:64,metadata:{preheat_minutes:45,bake_minutes:19},activities:[]},{id:'session_finish',type:'finishing',title:'Riposo',estimated_minutes:5,activities:[]}]};const schedule=CucinaHubTimelineEngine.build({workflow,targetAt:target});const validation=CucinaHubTimelineEngine.validate(schedule);const bake=schedule.events.find(e=>e.kind==='bake'),preheat=schedule.events.find(e=>e.kind==='preheat'),proof=schedule.events.find(e=>e.source_phase_id==='session_proof');const checks=[validation.valid,new Date(schedule.target_at).getTime()===target.getTime(),new Date(bake.end_at).getTime()===new Date(schedule.events.find(e=>e.source_phase_id==='session_finish').start_at).getTime(),preheat.parallel===true,new Date(preheat.start_at)<new Date(proof.end_at),schedule.summary.overlap_minutes===45];if(checks.some(v=>!v))throw new Error('Una o più verifiche del motore non sono riuscite.');$('#status').className='ok';$('#status').textContent='Test completato: calcolo a ritroso, orario obiettivo e sovrapposizione funzionano.';$('#summary').innerHTML=`<div class="metric">Inizio<strong>${time(schedule.start_at)}</strong></div><div class="metric">Pasto<strong>${time(schedule.target_at)}</strong></div><div class="metric">Tempo attivo<strong>${Math.round(schedule.summary.active_minutes)} min</strong></div><div class="metric">Sovrapposizione<strong>${Math.round(schedule.summary.overlap_minutes)} min</strong></div>`;$('#events').innerHTML=schedule.events.map(e=>`<div class="event ${e.parallel?'parallel':''}"><strong>${time(e.start_at)}–${new Date(e.end_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})} · ${e.title}</strong><br><small>${Math.round(e.duration_minutes)} min${e.parallel?' · in parallelo':''}</small></div>`).join('')}catch(error){$('#status').className='error';$('#status').textContent=error.message}}$('#run').onclick=run;
</script></body></html>
